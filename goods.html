<style>
  /* 周邊頁樣品：保留現在網站的紅色風格，只改排版。
     1. 商品改成方格縮圖，點開才看多張圖、說明和購買
     2. 每個商品標賣貨便價格，燈箱裡提醒蝦皮可能比較貴
     3. 貼紙獨立一頁，這裡只留一塊 3D 貼紙牆當入口 */
  /* 頁首門楣、兩側角色、帶子花紋、白框、頁尾：在 shop-v3.css（跟貼紙頁共用） */

  /* 3D 貼紙牆入口：整塊都可以點，點了去貼紙頁 */
  .stkwall { display:block; position:relative; max-width:900px; margin:0 auto; text-decoration:none; color:inherit; border-radius:20px; padding:18px 12px 20px;
    background-color:var(--paper); background-image:radial-gradient(rgba(0,0,0,.055) 1px, transparent 1.2px); background-size:18px 18px;
    border:2px solid var(--pink); transition:border-color .15s, box-shadow .15s; }
  .stkwall:hover { border-color:var(--red2); box-shadow:0 8px 22px rgba(255,45,45,.12); }
  .stkwall { cursor:pointer; user-select:none; -webkit-user-select:none; }
  /* 一條可以左右滑的貼紙列：不顯示捲軸，靠兩端淡出提示還有更多 */
  .stkrow { display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; padding:4px 8px; scroll-behavior:auto;
    overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
  .stkrow::-webkit-scrollbar { display:none; }
  .stkrow.dragging { cursor:grabbing; }
  .stkrow.dragging .tile { pointer-events:none; }
  .stkfade { --fl:0px; --fr:0px; -webkit-mask:linear-gradient(90deg, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%); mask:linear-gradient(90deg, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%); }
  .stkfade.l { --fl:48px; } .stkfade.r { --fr:48px; }
  .stkrow .tile { flex:0 0 132px; padding:0 2px; cursor:inherit; }

  .stkrow .tile .stk img { width:calc(var(--mm) * 1.35px); max-width:124px; max-height:120px; }

  .stkwall-foot b { display:inline-block; background:var(--red); color:#fff; border-radius:999px; padding:8px 22px; font-size:14px; }

  /* 熱銷輪播的樣式在 shop-v3.css（首頁也用同一個） */

  .tee:hover { border-color:var(--red2); transform:translateY(-2px); box-shadow:0 6px 16px rgba(255,45,45,.15); }

  .crank a { position:relative; display:block; overflow:hidden; border-radius:16px; }

  .crank-note { text-align:center; margin:16px 0 12px; font-size:13px; color:var(--mute); }

  /* 卡冊縮圖：圖裁到書本身（上下不留白），底邊跟右邊明信片對齊同一條水平線（他要的） */
  .albumcard .ph { position:relative; display:block; height:178px; margin-top:1px; background:none; }   /* 放大 20%（他要的），底邊仍跟明信片同一條線 */

  .albumcard .tx { margin-top:10px; text-align:center; }   /* 名稱、價格置中在卡冊正下方（他要的，不要偏左） */

  /* 卡冊 3D 視窗 */
  .alb-lb { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(40,20,18,.62); padding:14px; }

  }

  @media (max-width:760px) {

<script src="shared.js?v=6b052956"></script>
<script src="shop-v3.js?v=212ea9da"></script>
<script src="tees-data.js?v=a827bcbf"></script>
<script src="books-data.js?v=72e1ebcd"></script>
<script src="postcards.js?v=79318134"></script>
<script>
(function () {
  // 商品資料在 data/products.json（後台 admin.html 讀寫的就是這份）；這裡只負責畫出來。
  // 圖片都是瘦身過的 WebP：-l＝點開看的大圖（最長邊 1400），-s＝卡片、輪播用的小圖（寬 600）
  function pic(s) { return 'img/opt/' + s.split('?')[0].replace(/^.*\//, '').replace(/\.(jpe?g|png)$/i, '') + '-l.webp'; }
  function small(s) { return s.replace(/-l\.webp$/, '-s.webp'); }
  fetch('data/products.json', { cache: 'no-cache' }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(render, function () {
    document.getElementById('app').innerHTML = '<p style="padding:40px;text-align:center">商品載入失敗，請重新整理。</p>';
  });
  function render(DATA) {
  // 隱藏的商品整個不出現；沒有蝦皮網址的就不放蝦皮按鈕
  var LIST = DATA.products.filter(function (p) { return !p.hidden; }).map(function (p, i) {
    return { id: p.id, section: p.section, special: p.special, name: p.name, findName: p.findName, price: p.price, from: p.from,
      soldout: p.soldout, noShopee: !p.shopee, note: p.note || '', order: i, date: p.date || '',
      open: p.special === 'postcards' ? CK_POSTCARDS.open : undefined,     // 明信片：點開是明信片牆（postcards.js），不是一般燈箱
      video: p.video,                // 影片嵌在商品視窗預覽圖的最後一格（IG reel、YouTube shorts 都可以）
      img: p.imgs[0], more: p.imgs.slice(1), shopee: p.shopee, view3d: p.view3d };
  });
  function sect(name) { return LIST.filter(function (x) { return x.section === name; }); }
  // 手搖動畫機（木頭雷雕，跟發條款不同）：合作蝦皮賣場在賣，正式站只有 6 支影片 → 影片縮圖一格一格，點了看 YouTube
  var CRANK_SHOP = 'https://shopee.tw/anine1233a?categoryId=100639&entryPoint=ShopByPDP&itemId=5616235760';
  var CRANK = ['p9CNWoHaUXs', '_5Gu2JIeGsk', 'YTVP22hC7FU', '2Qg2j6cpaHU', 'jSZN1Jf0muI', 'qoxzbcfF14E'];
  // LINE：兩張貼圖截圖＋表情貼／貼圖／主題三個商店連結
  var LINE_IMGS = ['images/175855938251855_orig.jpg', 'images/messageimage-1731392433840_orig.jpg'];
  // 第一顆是主按鈕（紅底）。縮圖是 LINE 貼圖，所以主按鈕是「貼圖」，連結換成新的那組（他給的，2026-10-03）
  var LINE_GO = [['貼圖', 'https://store.line.me/stickershop/product/28354394/zh-Hant?from=sticker'],
                 ['表情貼', 'https://store.line.me/emojishop/product/61712ca910d0d74276aa2680/zh-Hant'],
                 ['主題', 'https://store.line.me/themeshop/product/0e929099-410d-4620-a4ef-6cd1e513d8b2/zh-Hant']];
  // T 恤：資料在 tees-data.js（跟 T 恤頁共用）；這裡只放一小條
  var TEES = window.CK_TEES;
  CK.setProducts(LIST.concat(TEES));
  function teeCard(t) {
    return '<button class="tee white-box" data-prod="' + t.id + '"><span class="ph">' +
      (t.cut ? '<img class="cut" src="' + t.cut + '" alt="" loading="lazy">' : '<img src="' + t.img + '" alt="" loading="lazy">') + '</span>' +
      '<span class="tx"><b>' + CK.esc(t.name) + '</b><span class="pr">' + CK.priceText(t.price) + '</span></span></button>';
  }
  // 畫冊（資料跟畫冊頁共用 books-data.js）：實體畫冊在前，電子版接在後面、左上角標「電子版」（他要的）；價格先不放
  var BOOKS = window.CK_BOOKS.PRINT.map(function (b) { return [b, 0]; })
    .concat(window.CK_BOOKS.DIGI.map(function (b) { return [b, 1]; }));
  function bookCard(x, k) {
    var b = x[0];
    return '<button class="tee bookcard" data-book="' + k + '"><span class="ph"><img src="' + CK_SHOP.opt(b[2]) + '" alt="" loading="lazy" draggable="false">' +
      (x[1] ? '<i>電子版</i>' : '') + '</span>' +
      '<span class="tx"><b>' + CK.esc(b[0]) + '</b><small>' + CK.esc(b[1]) + '</small></span></button>';
  }
  // T 恤分頁先隱藏（後台統計幾乎沒人點進 T 恤頁），T 恤只放周邊頁這一條；tees.html 樣品留著備用
  var S = CK.STICKERS, LINKS = CK_SHOP.LINKS;

  function card(p) {
    var n = 1 + p.more.length;
    return '<button class="gcard" data-prod="' + p.id + '"><span class="ph"><img src="' + small(p.img) + '" alt="" loading="lazy">' +
      (n > 1 ? '<i class="cnt">▣ ' + n + '</i>' : '') + (p.soldout ? '<i class="so">絕版</i>' : '') + (p.view3d ? '<i class="d3">3D</i>' : '') + '</span>' +
      // 卡片上只放名稱和價格（說明在點開的燈箱裡）
      '<span class="tx"><b>' + CK.esc(p.name) + '</b>' +
      (p.soldout ? '<span class="pr off">已絕版</span>' : '<span class="pr">' + CK.priceText(p.price, p.from) + '</span>') + '</span></button>';
  }
  // 牆上的貼紙：保留傾斜和反光特效，但點下去是去貼紙頁（所以拿掉開 3D 預覽的標記、按鈕換成 span）
  // 全部單張＋組合排成一條，可以左右滑。點了不開 3D 預覽，而是去貼紙頁（所以拿掉預覽用的標記、按鈕換成 span）
  // 牆上不放 NEW 小標（他要拿掉）
  // 點貼紙直接開 3D 預覽（他要的，不跳去貼紙頁）→ 保留 data-sticker／data-set
  var wall = (CK.tiles(S) + CK.setTiles()).replace(/<i class="tag new">NEW<\/i>/g, '').replace(/<button class="tile/g, '<span class="tile').replace(/<\/button>/g, '</span>')
    .replace(/<img /g, '<img draggable="false" ');

  // 明信片有自己的一條（上面），全部周邊的方格裡就不重複放
  var POST = LIST.filter(function (x) { return x.special === 'postcards'; })[0];
  // 二創明信片不在商品資料裡（後台沒有這一項），名稱、價格寫在這裡；價格先照原創的單張價
  var FANP = { name: '二創明信片', price: 44, shopee: '' };
  var ALBUM = LIST.filter(function (x) { return x.special === 'album'; })[0];
  // 服飾區的商品（破防襪）接在 T 恤後面；盲盒自己一條（他要的）；其他周邊是下面的方格
  var APPAREL = sect('apparel');
  var BLINDS = sect('blind');
  var GRID = sect('other');
  function blindCard(p) {
    return '<button class="tee" data-prod="' + p.id + '"><span class="ph"><img src="' + small(p.img) + '" alt="" loading="lazy" draggable="false"></span>' +
      '<span class="tx"><b>' + CK.esc(p.name) + '</b><span class="pr">' + CK.priceText(p.price, p.from) + '</span></span></button>';
  }

  // 熱銷：照ちいかわマーケット最上面那排，沒有任何文字的輪播，可以拖、可以點。最熱銷的三款放最前面（打開就看到）
  // [商品, 從第幾張圖開始]：盲盒、動畫機各有兩款，用不同的圖當兩張卡，點了直接看那一款的圖
  var HOT = (DATA.hot || []).map(function (id) { return [id, 0]; });
  var hotCards = HOT.map(function (h) {
    var p = LIST.filter(function (x) { return x.id === h[0]; })[0];
    if (!p) return '';                     // 隱藏的商品不放進輪播
    var src = small([p.img].concat(p.more)[h[1]]);
    return '<a class="mq-card" data-prod="' + p.id + '" data-at="' + h[1] + '" title="' + CK.esc(p.name) + '"><img src="' + src + '" alt="' + CK.esc(p.name) + '" draggable="false"></a>';
  }).join('');
  var hot = hotCards;

  // 每一區一條滿版的帶子，各有自己很淡的底紋（照ちいかわマーケット用背景花紋分區）
  document.getElementById('app').innerHTML = CK.header('周邊', ['貼紙'], LINKS) + '<main class="page bands">' +
    // 「周邊一覽」大圖拿掉了（他要的），只留賣場按鈕
    '<section class="band b-dots b-hero"><div class="wrap">' + CK.hero().replace(/<img class="hero"[^>]*>/, '') + '</div>' +
    '<div class="mq-wrap"><button class="mq-arrow prev" aria-label="上一張">‹</button><div class="mq fit"><div class="mq-track">' + hot + '</div></div>' +
    '<button class="mq-arrow next" aria-label="下一張">›</button></div></section>' +
    // 盲盒：放在最上面、貼紙上方（他要的）；跟服飾一樣的一整條白框，左右滑
    (BLINDS.length ? '<section class="band b-stripe b-blind"><div class="wrap"><div class="sect-title">盲盒</div>' : '<div hidden>') +
    '<div class="stkwall teewall white-box" id="blindwall"><div class="stkfade"><div class="stkrow teerow" id="blindrow">' + BLINDS.map(blindCard).join('') + '</div></div></div>' +
    (BLINDS.length ? '</div></section>' : '</div>') +
    '<section class="band b-stripe b-stk"><div class="wrap"><div class="sect-title">貼紙</div>' +
    '<div class="stkwall white-box" id="stkwall" role="link" tabindex="0" aria-label="進入貼紙頁"><div class="stkfade"><div class="stkrow" id="stkrow">' + wall + '</div></div>' +
    // 說明文字盡量少（照大 IP 商店的做法：不寫數量、不教怎麼滑，只留一個「看全部」）
    // 下方正中間標價格，右邊低調的 VIEW ALL
    '<div class="stkwall-foot"><span class="pr">單張 NT$50</span><span class="more">VIEW ALL →</span></div></div>' +      // 他要低調：灰色小英文
    // 明信片：貼紙牆下面一條寬的明信片列（左右滑），點一張直接放大、可以翻背面
    '</div></section><section class="band b-stripe b-post"><div class="wrap"><div class="sect-title">原創明信片</div>' +
    '<div class="pcpair white-box' + (ALBUM ? '' : ' solo') + '">' + (ALBUM ? '<button class="albumcard" id="albumcard"><span class="ph"><img src="img/album-3d-v3.jpg" alt="' + CK.esc(ALBUM.name) + '"></span>' +
      '<span class="tx"><b>' + CK.esc(ALBUM.name) + '</b><span class="pr">' + CK.priceText(ALBUM.price, ALBUM.from) + '</span></span></button>' : '') +
    '<div class="stkwall pcwall" id="pcwall"><div class="stkfade"><div class="stkrow pcrow" id="pcrow">' + CK_POSTCARDS.stripHtml() + '</div></div><div class="stkwall-foot"><span class="pr">單張 NT$44</span></div></div></div>' +
    // 二創明信片：明信片下面自己一條（他要的，2026-10-03），排法跟明信片一樣；單面，點開只放大不翻
    '</div></section><section class="band b-stripe b-fan"><div class="wrap"><div class="sect-title">二創明信片</div>' +
    '<div class="pcpair white-box solo"><div class="stkwall pcwall" id="fcwall"><div class="stkfade"><div class="stkrow pcrow" id="fcrow">' + CK_FANCARDS.stripHtml() + '</div></div>' +
    '<div class="stkwall-foot"><span class="pr">單張 NT$' + FANP.price + '</span></div></div></div>' +
    '</div></section><section class="band b-stripe b-tee"><div class="wrap"><div class="sect-title">服飾</div>' +
    // 服飾也做成跟明信片一樣的一整條白框（他要的），自己左右滑；順序照系列：不想上班→不想加班→破防→拉麵，破防襪放最後，滑到底才看到（點開破防T也看得到）
    '<div class="stkwall teewall white-box" id="teewall"><div class="stkfade"><div class="stkrow teerow" id="teerow">' + ['tee-nowork', 'tee-noot', 'tee-pofang', 'tee-ramen'].map(function (id) { return TEES.filter(function (t) { return t.id === id; })[0]; }).concat(APPAREL).map(teeCard).join('') + '</div></div></div>' +
    // 畫冊：服飾下面一條，排法跟服飾一樣（他要的，2026-10-03）
    '</div></section><section class="band b-stripe b-book"><div class="wrap"><div class="sect-title">畫冊</div>' +
    '<div class="stkwall teewall white-box" id="bookwall"><div class="stkfade"><div class="stkrow teerow" id="bookrow">' + BOOKS.map(bookCard).join('') + '</div></div></div>' +
    // 「蝦皮可能較貴」只在點開的購買區說（buyBox 裡本來就有）
    '</div></section><section class="band b-dots b-all"><div class="wrap"><div class="sect-title">其他周邊</div>' +
    '<div class="sortbar" id="sortbar"><button data-sort="rec" class="on">推薦</button><button data-sort="new">最新上架</button>' +
    '<button data-sort="low">價格低→高</button><button data-sort="high">價格高→低</button></div>' +
    '<div class="grid" id="grid">' + GRID.map(card).join('') + '</div>' +
    '</div></section>' +
    // 正式站周邊頁最後兩區（之前沒搬到）：手搖動畫機、LINE 貼圖
    '<section class="band b-stripe b-crank"><div class="wrap"><div class="sect-title">手搖動畫機</div>' +
    '<div class="crank">' + CRANK.map(function (v) {
      return '<a class="white-box" data-track-label="手搖動畫機影片" href="https://youtu.be/' + v + '" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/' + v + '/hqdefault.jpg" alt="手搖動畫機影片" loading="lazy"><i>▶</i></a>';
    }).join('') + '</div>' +
    '<p class="crank-note">木頭雷雕・跟發條款不同</p>' +
    '<div class="v3-btns"><a class="v3-btn" href="' + CRANK_SHOP + '" target="_blank" rel="noopener">合作蝦皮賣場</a></div>' +
    '</div></section>' +
    '<section class="band b-dots b-line"><div class="wrap"><div class="sect-title">LINE 貼圖</div>' +
    '<div class="lineimgs">' + LINE_IMGS.map(function (src) { return '<img class="white-box" src="' + small(pic(src)) + '" alt="LINE 貼圖" loading="lazy">'; }).join('') + '</div>' +
    '<div class="v3-btns">' + LINE_GO.map(function (l, i) { return '<a class="v3-btn' + (i ? ' sub' : '') + '" href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + '</a>'; }).join('') + '</div>' +
    '</div></section></main>' + CK.footer();

  // 頁首 Logo 兩側：附屬看板的兩隻（購物空罐妹妹、購物罐罐），一左一右、不要太大
  CK_SHOP.chars();
  CK_SHOP.pet();          // 螢幕寵物：先在周邊頁試（他選的 A）

  // 熱銷輪播（停 3.5 秒跳一格、ちいかわ的煞車曲線、可拖可滑）：共用的 CK_SHOP.carousel()
  CK_SHOP.carousel(document.querySelector('.mq-wrap'));
  // 全部周邊的排序：推薦＝原本的順序；絕版的一律排最後；同分的照原本順序
  var SORTS = {
    rec: function (a, b) { return a.order - b.order; },
    new: function (a, b) { return (b.date || '').localeCompare(a.date || '') || a.order - b.order; },
    low: function (a, b) { return a.price - b.price || a.order - b.order; },
    high: function (a, b) { return b.price - a.price || a.order - b.order; }
  };
  document.getElementById('sortbar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
    var by = SORTS[b.dataset.sort];
    var list = GRID.slice().sort(function (x, y) { return (x.soldout ? 1 : 0) - (y.soldout ? 1 : 0) || by(x, y); });
    document.getElementById('grid').innerHTML = list.map(card).join('');
  });

  // 可以左右滑的一條（貼紙牆、明信片列共用）：電腦用滑鼠按住左右拖、手機用手指滑；沒拖動的單純點一下才算點擊
  function swipeRow(box, row, onClick) {
    var down = null, moved = false;
    row.addEventListener('pointerdown', function (e) {
      moved = false;
      if (e.pointerType !== 'mouse') return;          // 手機交給瀏覽器原生的滑動
      down = { x: e.clientX, left: row.scrollLeft, id: e.pointerId };
    });
    window.addEventListener('pointermove', function (e) {
      if (!down || e.pointerId !== down.id) return;
      var dx = e.clientX - down.x;
      if (Math.abs(dx) > 5) { moved = true; row.classList.add('dragging'); }
      if (moved) row.scrollLeft = down.left - dx;
    });
    window.addEventListener('pointerup', function () { down = null; row.classList.remove('dragging'); });
    box.addEventListener('click', function (e) { if (moved) { moved = false; return; } onClick(e); });
    // 兩端的淡出：還有東西可以滑的那一邊才淡出
    function edges() {
      var f = row.parentNode;
      f.classList.toggle('l', row.scrollLeft > 4);
      f.classList.toggle('r', row.scrollLeft < row.scrollWidth - row.clientWidth - 4);
    }
    row.addEventListener('scroll', edges); window.addEventListener('resize', edges); edges();
  }
  // 貼紙牆：點了去貼紙頁
  var GO = 'stickers.html', stk = document.getElementById('stkwall');
  // 只有 VIEW ALL 去貼紙頁；點貼紙由共用的點擊處理開 3D。拖過的那一下不算點（不開也不跳頁）
  swipeRow(stk, document.getElementById('stkrow'), function (e) { if (e.target.closest('.more')) location.href = GO; });
  (function () {
    var x0 = null, dragged = false;
    stk.addEventListener('pointerdown', function (e) { x0 = e.clientX; dragged = false; });
    window.addEventListener('pointermove', function (e) { if (x0 != null && Math.abs(e.clientX - x0) > 5) dragged = true; });
    window.addEventListener('pointerup', function () { x0 = null; });
    stk.addEventListener('click', function (e) { if (dragged) { dragged = false; e.stopPropagation(); e.preventDefault(); } }, true);
  })();
  stk.addEventListener('keydown', function (e) { if (e.key === 'Enter') location.href = GO; });
  // 服飾列、盲盒列、畫冊列：可以拖可以滑；拖過就不算點（不打開商品）
  [['teewall', 'teerow'], ['blindwall', 'blindrow'], ['bookwall', 'bookrow']].forEach(function (ids) {
    var box = document.getElementById(ids[0]), row = document.getElementById(ids[1]), dragged = false, x0 = null;
    swipeRow(box, row, function () {});
    row.addEventListener('pointerdown', function (e) { dragged = false; x0 = e.clientX; });
    window.addEventListener('pointermove', function (e) { if (x0 != null && Math.abs(e.clientX - x0) > 5) dragged = true; });
    window.addEventListener('pointerup', function () { x0 = null; });
    box.addEventListener('click', function (e) { if (dragged) { dragged = false; e.stopPropagation(); e.preventDefault(); } }, true);
  });
  // 畫冊列：點一本開跟畫冊頁一樣的燈箱（封面＋內頁；實體版是賣貨便／海外購買，電子版是電子版賣場）
  document.getElementById('bookwall').addEventListener('click', function (e) {
    var c = e.target.closest('[data-book]'); if (c) { var x = BOOKS[+c.dataset.book]; CK_BOOKS.open(x[0], x[1]); }
  });
  // 二創明信片列：跟明信片列一樣，點哪一張放大哪一張、點空白處打開整面牆
  swipeRow(document.getElementById('fcwall'), document.getElementById('fcrow'), function (e) {
    var c = e.target.closest('[data-pcs]');
    CK_FANCARDS.open(FANP, c ? +c.dataset.pcs : null);
  });
  // 明信片列：點哪一張就放大哪一張；點到空白處就打開整面明信片牆
  swipeRow(document.getElementById('pcwall'), document.getElementById('pcrow'), function (e) {
    var c = e.target.closest('[data-pcs]');
    CK_POSTCARDS.open(POST, c ? +c.dataset.pcs : null);
  });

  // ---- 明信片卡冊 3D 視窗（album3d.js）：可以轉、打開、翻頁，點下面的明信片放進現在這頁的口袋 ----
  // 讓大家看懂：一頁正反兩面各放一張、25 頁共 50 張
  var alb = null, albView = null;
  var ALB_PH = ['img/opt/1229182880_orig-l.webp', 'img/opt/album-ph4-l.webp'];   // 照片只放這兩張（他選的；其他是拍給我參考的）
  function phGo(i) {
    alb.querySelector('.alb-ph .big').src = ALB_PH[i];
    alb.querySelectorAll('.alb-ph .thumbs img').forEach(function (t, k) { t.classList.toggle('on', k === i); });
  }
  function albUi() {
    if (!albView) return;
    var f = albView.spread, n = albView.pageCount;
    alb.querySelector('.alb-page').textContent = albView.isOpen ? (f >= n ? '最後一頁' : '第 ' + (f + 1) + ' / ' + n + ' 頁') : '';
    alb.querySelector('.alb-count').textContent = '已放 ' + albView.filled + ' / 50 張';
    alb.querySelector('.alb-arr.prev').hidden = !albView.isOpen || f === 0;
    alb.querySelector('.alb-arr.next').hidden = !albView.isOpen || f >= n;
    // 左右兩邊各標是第幾頁的哪一面：讓人一看就懂一頁正反兩面各放一張
    alb.querySelector('.alb-side.l').textContent = albView.isOpen ? (f ? '第 ' + f + ' 頁・背面' : '封面內側') : '';
    alb.querySelector('.alb-side.r').textContent = albView.isOpen ? (f < n ? '第 ' + (f + 1) + ' 頁・正面' : '封底內側') : '';
  }
  function albumOpen() {
    if (!alb) {
      alb = document.createElement('div'); alb.className = 'alb-lb';
      alb.innerHTML = '<div class="alb-box" role="dialog" aria-modal="true" aria-label="明信片卡冊"><button class="alb-x" aria-label="關閉">✕</button>' +
        '<div class="alb-tabs"><button data-v="3d" class="on">3D</button><button data-v="ph">照片</button></div>' +
        '<div class="alb-3d"><div class="alb-stage"></div><span class="alb-side l"></span><span class="alb-side r"></span><button class="alb-arr prev" aria-label="上一頁">‹</button><button class="alb-arr next" aria-label="下一頁">›</button>' +
          '<div class="alb-ctl"><span class="alb-page"></span><span class="alb-count"></span></div>' +
          '<div class="alb-pick"><p>點明信片放進卡冊</p><div class="alb-row">' + CK_POSTCARDS.list.map(function (c, i) {
            return '<button data-k="' + i + '" class="' + (c.wide ? 'wide' : '') + '"><img src="' + c.s + '" alt="' + CK.esc(c.name) + '" loading="lazy"></button>';
          }).join('') + '</div></div></div>' +
        '<div class="alb-ph" hidden><img class="big" alt=""><div class="thumbs">' + ALB_PH.map(function (src, i) { return '<img src="' + src + '" data-i="' + i + '" alt="">'; }).join('') + '</div></div>' +
        '<div class="alb-foot"><div><h3>明信片卡冊</h3><small>15 × 17 cm・厚 3 cm・25 頁，正反面各一張，共 50 張</small></div>' +
          '<div class="buybox">' + CK.buyBox(ALBUM.name, ALBUM.price, { shopee: ALBUM.shopee, noShopee: ALBUM.noShopee, findName: ALBUM.findName }) + '</div></div></div>';
      document.body.appendChild(alb);
      import(CK_MOD('album3d.js')).then(function (m) {
        albView = m.create();
        albView.onTap(albUi);
        albView.mount(alb.querySelector('.alb-stage')); albUi();
      });
      alb.addEventListener('click', function (e) {
        if (CK_bgClick(alb, e) || e.target.closest('.alb-x')) return albumClose();
        var tab = e.target.closest('.alb-tabs button');
        if (tab) {
          alb.querySelectorAll('.alb-tabs button').forEach(function (b) { b.classList.toggle('on', b === tab); });
          alb.querySelector('.alb-3d').hidden = tab.dataset.v !== '3d';
          alb.querySelector('.alb-ph').hidden = tab.dataset.v !== 'ph';
          if (tab.dataset.v === 'ph') phGo(0); else if (albView) albView.resize();
          return;
        }
        var th = e.target.closest('.alb-ph .thumbs img'); if (th) return phGo(+th.dataset.i);
        if (!albView) return;
        if (e.target.closest('.alb-arr.prev')) albView.flip(-1);
        else if (e.target.closest('.alb-arr.next')) albView.flip(1);
        else {
          var pc = e.target.closest('.alb-row button');
          if (pc) {
            var c = CK_POSTCARDS.list[+pc.dataset.k];
            // 這一面兩個口袋都滿了就自動翻到下一頁再放
            var card = { img: c.l, wide: c.wide, back: 'img/post/' + (c.wide ? 'back-h.webp' : 'back-v.webp') };   // 明信片背面（跟明信片牆翻面用的同一張）
            if (!albView.insert(card)) { albView.flip(1); albView.insert(card); }
          }
        }
        albUi();
      });
      document.addEventListener('keydown', function (e) {
        if (!alb.classList.contains('open')) return;
        if (e.key === 'Escape') albumClose();
        else if (albView && e.key === 'ArrowRight') { albView.flip(1); albUi(); }
        else if (albView && e.key === 'ArrowLeft') { albView.flip(-1); albUi(); }
      });
      window.addEventListener('resize', function () { if (albView && alb.classList.contains('open')) albView.resize(); });
    }
    alb.classList.add('open'); document.body.style.overflow = 'hidden';
    if (albView) albView.mount(alb.querySelector('.alb-stage'));
  }
  function albumClose() { alb.classList.remove('open'); document.body.style.overflow = ''; }
  if (ALBUM) document.getElementById('albumcard').addEventListener('click', albumOpen);
  }
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

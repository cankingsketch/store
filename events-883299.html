<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實體店寄售｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css?v=78fdbfc9">
<link rel="stylesheet" href="shop-v3.css?v=9559091f">
<style>
  /* 實體店寄售樣品：內容照正式站 events-883299.html。每家店一張白卡：店名、賣什麼（小標籤）、地址、開地圖 */
  .stores { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .store { display:flex; flex-direction:column; padding:22px 20px 20px; border-radius:22px; text-align:left; }
  .store .nm { margin:0; font-size:19px; font-weight:900; color:var(--ink); }
  .store .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .store .tags span { font-size:12.5px; font-weight:700; color:var(--red2); background:#fff1ee; border-radius:999px; padding:3px 10px; }
  .store .addr { margin:14px 0 0; font-size:14px; line-height:1.6; color:var(--ink); }
  .store .note { margin:6px 0 0; font-size:13px; line-height:1.6; color:var(--mute); }
  .store .v3-btns { justify-content:flex-start; margin-top:auto; padding-top:16px; }
  .shot { max-width:420px; margin:0 auto; padding:10px; border-radius:22px; text-align:center; }
  .shot img { display:block; width:100%; border-radius:14px; }
  .shot p { margin:10px 0 2px; font-size:14px; color:var(--mute); }
  @media (max-width:860px) { .stores { grid-template-columns:1fr; max-width:460px; margin:0 auto; } }
</style>
<meta name="description" content="空罐王商品的實體寄售店。">
<link rel="canonical" href="https://cankingstore.com/events-883299">
<meta property="og:site_name" content="空罐王的商店">
<meta property="og:title" content="實體店寄售">
<meta property="og:description" content="空罐王商品的實體寄售店。">
<meta property="og:url" content="https://cankingstore.com/events-883299">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="stickers.js?v=71bd9139"></script>
<script src="shared.js?v=2aa02ea2"></script>
<script src="shop-v3.js?v=da31c7eb"></script>
<script>
(function () {
  var MAP = 'https://www.google.com/maps/search/?api=1&query=';
  // [店名, [賣什麼…], 地址, 補充, 地圖查詢字]
  var STORES = [
    ['虎之穴 台北店', ['畫冊 5 款', '立牌 4 款'], '台北市中正區漢口街一段 85 號　博愛公元大樓 2F', '', '台北市中正區漢口街一段85號'],
    ['南風窗簾 基隆', ['轉蛋機 ×2', '可換零錢'], '基隆市仁愛區仁一路 233 號', '門口兩台轉蛋機，「今日吃甚麼?」共六款。', '基隆市仁愛區仁一路233號'],
    ['時尚小拉基 台中', ['明信片', '盲盒', '畫冊'], '臺中市北區精武路 320-6 號', '商品在 B1。', '臺中市北區精武路320-6號']
  ];
  CK_SHOP.page('實體店寄售', [
    '<section class="band v3 b-stripe"><div class="v3-wrap">' + CK_SHOP.head('實體店寄售', 'STORES') +
      '<div class="stores">' + STORES.map(function (s) {
        return '<div class="store white-box"><p class="nm">' + s[0] + '</p><div class="tags">' + s[1].map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div>' +
          '<p class="addr">' + s[2] + '</p>' + (s[3] ? '<p class="note">' + s[3] + '</p>' : '') +
          '<div class="v3-btns"><a class="v3-btn sub" data-track-label="地圖・' + s[0] + '" href="' + MAP + encodeURIComponent(s[4]) + '" target="_blank" rel="noopener">開地圖</a></div></div>';
      }).join('') + '</div>' +
    '</div></section>',
    '<section class="band v3 b-dots"><div class="v3-wrap">' + CK_SHOP.head('店內實景', 'IN STORE') +
      '<div class="shot white-box"><img src="' + CK_SHOP.opt('small-gabege1200_orig.jpg', 'l') + '" alt="時尚小拉基 B1 櫃位"><p>時尚小拉基（台中）B1</p></div>' +
    '</div></section>'
  ]);
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 手機：不准縮放、畫面延伸到瀏海下（用 safe-area 避開） -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- 加入主畫面後全螢幕開啟，沒有網址列、也沒有左滑返回 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="貓咪吐">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4efe4">
<title>貓咪吐</title>
<style>
  :root{ --stroke:#5a79a3; --bg:#f4efe4; --outer:#e8e0cf; }
  html,body{margin:0;height:100%;overflow:hidden;background-color:var(--outer);
    position:fixed;inset:0;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:var(--bg);
    border-radius:34px;box-shadow:0 0 0 6px var(--stroke),0 18px 50px rgba(60,50,30,.25)}
  #stage.phone{left:0;top:0;transform:none;border-radius:0;box-shadow:none}
  #stage.play canvas{cursor:none}
  canvas{display:block;touch-action:none}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));box-sizing:border-box;
    font-family:"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--stroke);text-align:center;
    background:rgba(244,239,228,.72)}
  .hidden{display:none!important}
  h1{margin:0;font-size:34px;line-height:1.35;font-weight:900;letter-spacing:2px}
  /* 開始畫面：讓人看到後面淡淡的貓。標題（上四下三、1.5 倍大）貼在貓頭上方，START 稍微壓在貓腳下；位置由 main.js 依貓在畫面上的位置算 */
  #title h1{position:absolute;left:0;right:0;font-size:51px;line-height:1.25}
  #title #start{position:absolute;left:0;right:0;margin:0 auto;width:fit-content}
  button{font:900 28px/1 "PingFang TC","Microsoft JhengHei",sans-serif;color:var(--stroke);background:#fff;
    border:5px solid var(--stroke);border-radius:14px;padding:16px 40px;cursor:pointer;touch-action:manipulation}
  button:active{transform:scale(.95)}
  button.sub{font-size:20px;padding:10px 26px;border-width:4px}
  #grade{font:900 96px/1 "Arial Black","PingFang TC","Microsoft JhengHei",sans-serif}
  #result{gap:14px}
  #rotate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:var(--bg);color:var(--stroke);font:900 26px/1.5 "PingFang TC","Microsoft JhengHei",sans-serif;text-align:center}
  #rotate .phoneIcon{width:70px;height:120px;border:6px solid var(--stroke);border-radius:14px;animation:turn 1.6s ease-in-out infinite}
  @keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
  #desc{font-size:26px;font-weight:900;line-height:1.4}
  #amt{font-size:20px;font-weight:700;line-height:1.6}
  #credit{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));font-size:12px;font-weight:700;line-height:1.5;opacity:.6}
  #cupNum{position:absolute;z-index:2;transform:translate(-50%,0);font:900 64px/1 "PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--stroke);pointer-events:none;white-space:nowrap;
    text-shadow:0 0 6px var(--bg),0 0 6px var(--bg),0 0 3px var(--bg)}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="rotate" class="hidden"><div class="phoneIcon"></div>請把手機直著拿</div>
<div id="stage">
  <div id="cupNum" class="hidden"></div>
  <div id="title" class="panel">
    <h1>接住貓的<br>嘔吐物</h1>
    <button id="start">START</button>
  </div>
  <div id="result" class="panel hidden">
    <div id="grade"></div>
    <div id="desc"></div>
    <div id="amt"></div>
    <button id="again">再玩一次</button>
    <button id="share" class="sub">分享截圖</button>
    <div id="credit">嘔吐聲：空罐王的老婆<br>貓叫聲：小森平</div>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯名手機殼｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css?v=8bb3fd58">
<link rel="stylesheet" href="shop-v3.css?v=9559091f">
<style>
  /* 聯名手機殼：2026 新版宣傳圖（正方形）做成跟周邊頁頂端一樣的輪播（CK_SHOP.carousel），電腦一次看到兩張；
     手機照共用的設定一次一張大的。點圖連到 DEVILCASE 手機試衣間 */
  .phone-mq .mq { --n:2; }
  @media (max-width:760px) { .phone-mq .mq { --n:1.3; } }
  .cases-go { margin-top:26px; }
  .rhino-sec { margin-top:72px; }
  .devil-sec { margin-top:40px; }
  /* 犀牛盾（2026-10-19）：圖案在犀牛盾的創作者頁，宣傳圖＋流程說明圖（他做的截圖加上三步驟），點了都開創作者頁。
     兩張圖的寬度、間距、卡片樣式跟上面惡魔盾的輪播一樣（他要上下對齊）：寬度用 .mq 的 --w、間距 20px */
  .rhino { display:grid; grid-template-columns:1fr 1fr; gap:20px; width:min(1040px, 100vw - 64px); margin:0 auto; padding:6px 0; }
  .rhino a { display:block; aspect-ratio:1 / 1; border-radius:16px; overflow:hidden; background:#fff;
    border:3px solid #fff; box-shadow:0 2px 12px rgba(0,0,0,.09); }
  .rhino img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .35s; }
  .rhino a:hover img { transform:scale(1.04); }
  @media (orientation:portrait) { .rhino { width:calc(100vw - 24px); gap:10px; } }   /* 跟 .mq 直立時的 --w、--g 一樣 */
  @media (max-width:760px) { .rhino { grid-template-columns:1fr; width:auto; } .rhino a { border-radius:10px; border-width:2px; } }
</style>
<meta name="description" content="空罐王 × DEVILCASE 聯名手機殼。">
<link rel="canonical" href="https://cankingstore.com/3287921517251632723127580">
<meta property="og:site_name" content="空罐王的商店">
<meta property="og:title" content="聯名手機殼">
<meta property="og:description" content="空罐王 × DEVILCASE 聯名手機殼。">
<meta property="og:url" content="https://cankingstore.com/3287921517251632723127580">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="stickers.js?v=71bd9139"></script>
<script src="shared.js?v=abdce4c2"></script>
<script src="shop-v3.js?v=da31c7eb"></script>
<script>
(function () {
  var I = CK_SHOP.IMG, GO = 'https://devilcase.net/Canking';
  var RHINO = 'https://my.rhinoshield.tw/artist/@canking';   // 空罐王在犀牛盾的創作者頁（2026-10-20 拿到）
  // 2026 惡魔盾宣傳圖（NAS 自繪/商品/手機殼/2026/宣傳圖，1800×1800 PNG → img/opt 的 webp）
  // 5b：他改過第 5 張（充電頭的字），換檔名避開快取
  var PICS = ['devilcase2026-1.png', 'devilcase2026-2.png', 'devilcase2026-3.png', 'devilcase2026-4.png', 'devilcase2026-5b.png'];
  CK_SHOP.page('聯名手機殼', [
    '<section class="band v3 b-dots"><div class="v3-wrap">' + CK_SHOP.head('聯名手機殼', 'PHONE CASES') +
      // 兩個品牌各一個小標題，格式跟下面的犀牛盾一樣（他要的）
      '<div class="devil-sec">' + CK_SHOP.head('惡魔防摔殼', 'DEVILCASE') + '</div>' +
      '<div class="mq-wrap phone-mq"><button class="mq-arrow prev" aria-label="上一張">‹</button><div class="mq"><div class="mq-track">' +
        PICS.map(function (s) {
          return '<a class="mq-card" href="' + GO + '" target="_blank" rel="noopener"><img src="' + CK_SHOP.opt(s, 'l') + '" alt="聯名手機殼" draggable="false"></a>';
        }).join('') +
      '</div></div><button class="mq-arrow next" aria-label="下一張">›</button></div>' +
      '<div class="v3-btns cases-go"><a class="v3-btn" data-track-label="聯名手機殼" href="' + GO + '" target="_blank" rel="noopener">手機試衣間</a></div>' +
      // 犀牛盾跟上面的惡魔盾都是手機殼：放在同一條帶子裡，背景花紋一路延伸下去（他要的）
      '<div class="rhino-sec">' + CK_SHOP.head('犀牛盾', 'RHINOSHIELD') +
      '<div class="rhino">' +
        '<a href="' + RHINO + '" target="_blank" rel="noopener" data-track-label="犀牛盾手機殼"><img src="' + CK_SHOP.opt('rhino2026.png', 'l') + '" alt="犀牛盾 × 空罐王 自由拼貼你的殼" loading="lazy"></a>' +
        '<a href="' + RHINO + '" target="_blank" rel="noopener" data-track-label="犀牛盾手機殼"><img src="' + CK_SHOP.opt('rhino-howto2.png', 'l') +
          '" alt="載具手機殼：1 進空罐王的犀牛盾頁，點喜歡的手機殼　2 點下方的客製化設計　3 點左邊載具建立條碼，貼到圖上的白框" loading="lazy"></a>' +
      '</div>' +
      '<div class="v3-btns cases-go"><a class="v3-btn" data-track-label="犀牛盾手機殼" href="' + RHINO + '" target="_blank" rel="noopener">去犀牛盾設計</a></div>' +
      '</div>' +
    '</div></section>'
  ]);
  CK_SHOP.carousel(document.querySelector('.phone-mq'));
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

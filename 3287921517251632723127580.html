<style>
  /* 聯名手機殼：2026 新版宣傳圖（正方形）做成跟周邊頁頂端一樣的輪播（CK_SHOP.carousel），電腦一次看到兩張；
     手機照共用的設定一次一張大的。點圖連到 DEVILCASE 手機試衣間 */
  .phone-mq .mq { --n:2; }
  @media (max-width:760px) { .phone-mq .mq { --n:1.3; } }
  .cases-go { margin-top:26px; }
  /* 犀牛盾（2026-10-19）：圖案放在犀牛盾客製化的圖庫裡、沒有單獨的連結 → 宣傳圖＋三步驟教學＋直接開客製化頁。
     教學只寫找不到的地方，關鍵字跟犀牛盾畫面上的字一樣（他說要精簡，怕大家不讀） */
  /* 左圖右教學一樣大（他要的）：兩欄等寬、高度跟著宣傳圖拉齊，教學內容在框裡置中 */
  .rhino { display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:stretch; }
  .rhino-pic { display:block; padding:10px; border-radius:22px; }
  .rhino-pic img { display:block; width:100%; border-radius:14px; }
  .rhino-how { display:flex; flex-direction:column; justify-content:center; padding:24px 28px; border-radius:22px; text-align:left; }
  .rhino-how h3 { margin:0 0 4px; font-size:19px; font-weight:900; color:var(--ink); }
  .rhino-how .sub { margin:0 0 14px; font-size:14px; color:var(--mute); }
  .rhino-how ol { list-style:none; margin:0; padding:0; counter-reset:st; }
  .rhino-how li { counter-increment:st; position:relative; padding:0 0 0 38px; margin:0 0 14px; font-size:15px; line-height:1.6; color:var(--ink); }
  .rhino-how li::before { content:counter(st); position:absolute; left:0; top:-1px; width:27px; height:27px; border-radius:50%;
    background:var(--red2); color:#fff; font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .rhino-how li b { color:var(--red2); }
  .rhino-how .v3-btns { justify-content:flex-start; margin-top:6px; }
  @media (min-width:761px) {   /* 框跟宣傳圖一樣高，字放大一點才不會空空的 */
    .rhino-how { padding:32px 40px; }
    .rhino-how h3 { font-size:26px; }
    .rhino-how .sub { font-size:16px; margin-bottom:22px; }
    .rhino-how li { font-size:18px; padding-left:46px; margin-bottom:18px; }
    .rhino-how li::before { width:32px; height:32px; font-size:16px; top:-2px; }
    .rhino-how .v3-btns { margin-top:12px; }
  }
  @media (max-width:760px) { .rhino { grid-template-columns:1fr; } }
</style>

<script>

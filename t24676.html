<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T恤｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css?v=8bb3fd58">
<style>
  /* T 恤頁樣品（第三版）：照正式站 T 恤頁原本的編排（他喜歡原本的版面），只用原本頁面上的圖，
     但原本每件的圖由上往下一張一張排、整頁很長（桌機約 6700px）。
     改成每一件一列：左邊大圖（原本那件的第一張）、右邊是這件的資訊＋其他圖縮成小拼貼，點任何一張放大看。 */
  .site-head .logo.new, .head-contact { display:none; }
  .page { background:#fafafa; }
  .back { top:12px; bottom:auto; }

  .ts { max-width:1000px; margin:0 auto; padding:34px 16px 0; }
  .ts + .ts { border-top:1px dashed #e6d5d3; margin-top:34px; }
  .ts-head { text-align:center; }
  .ts-head h2 { margin:0; font-size:30px; font-weight:900; color:var(--ink); }
  .ts-head .buy { margin-top:12px; }
  .ts-body { display:grid; grid-template-columns:62fr 38fr; gap:14px; margin-top:20px; align-items:start; }
  .ts-body img { display:block; width:100%; border-radius:4px; cursor:zoom-in; background:#eee; }
  .ts .main img { height:auto; }
  .side { display:flex; flex-direction:column; gap:10px; }
  .info { background:#fff; border:2px solid var(--pink); border-radius:12px; padding:12px 14px; font-size:13.5px; color:#555; line-height:1.75; }
  .info .row1 { display:flex; align-items:center; gap:8px; color:var(--ink); }
  .info .dot { width:13px; height:13px; border-radius:50%; border:1px solid rgba(0,0,0,.18); }
  .info .pr { margin-left:auto; color:var(--red2); font-weight:800; font-size:16px; }
  .info .pre { font-size:11px; color:var(--red2); border:1px solid #f3b3ae; border-radius:4px; padding:0 5px; }
  .info a.size { color:var(--red2); cursor:pointer; border-bottom:1px solid #f3b3ae; }
  /* 其他圖的小拼貼：兩欄，正方形裁切；只有一張時整欄；三張時第一張橫跨兩欄 */
  .mosaic { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mosaic img { aspect-ratio:1/1; object-fit:cover; height:100%; }
  .mosaic.n1 { grid-template-columns:1fr; }
  .mosaic.n3 img:first-child { grid-column:span 2; aspect-ratio:16/10; }

  .site-foot { display:block; background:var(--red2); color:#fff; text-align:center; padding:34px 16px 30px; margin-top:60px; }
  .site-foot .sns { display:flex; justify-content:center; gap:18px; }
  .site-foot .sns a { width:44px; height:44px; border-radius:50%; background:#fff; color:var(--red2); display:grid; place-items:center; }
  .site-foot .sns svg { width:22px; height:22px; }
  .site-foot small { display:block; margin-top:16px; font-size:13px; }
  @media (max-width:760px) {
    .ts-body { grid-template-columns:1fr; }
    /* 手機：其他圖改成一排可以左右滑的小圖 */
    .mosaic, .mosaic.n1, .mosaic.n3 { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
    .mosaic img, .mosaic.n3 img:first-child { flex:0 0 38%; aspect-ratio:1/1; }
  }
</style>
<meta name="description" content="空罐王的 T 恤。">
<link rel="canonical" href="https://cankingstore.com/t24676">
<meta property="og:site_name" content="空罐王的商店">
<meta property="og:title" content="T恤">
<meta property="og:description" content="空罐王的 T 恤。">
<meta property="og:url" content="https://cankingstore.com/t24676">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="stickers.js?v=71bd9139"></script>
<script src="shared.js?v=a46717ca"></script>
<script src="tees-data.js?v=8cfe961e"></script>
<script>
(function () {
  var INFO = window.CK_TEE_INFO, MYSHIP = 'https://myship.7-11.com.tw/general/detail/GM2308212736960';
  // T 恤頁不放 3D（周邊頁的 T 恤列才有）；點開的說明＝系列、顏色、尺寸、實穿照的模特兒
  var TEES = window.CK_TEES.map(function (t) {
    var c = Object.assign({}, t);
    delete c.view3d;
    c.note = '空罐系列 ' + t.series + '・' + t.note + (t.model ? '・' + t.model : '');
    return c;
  });
  CK.setProducts(TEES);
  var LINKS = { '課程': 'lessons.html', '周邊': 'goods.html', '貼紙': 'stickers.html', 'T恤': 't24676.html' };   // T 恤頁沒載 shop-v3.js（隱藏中）

  // 一件一段：標題＋購買按鈕（跟原本頁面一樣），下面左大圖、右資訊＋其他圖
  function section(t) {
    var imgs = [t.img].concat(t.more), rest = imgs.slice(1);
    return '<section class="ts" id="' + t.id + '"><div class="ts-head"><h2>' + CK.esc(t.name) + '</h2>' +
      '<div class="buy"><a class="main" href="' + MYSHIP + '" target="_blank" rel="noopener">711賣貨便</a>' +
      '<a class="sub" href="' + INFO.FORM + '" target="_blank" rel="noopener">海外預購</a></div></div>' +
      '<div class="ts-body"><a class="main" data-prod="' + t.id + '" data-at="0"><img src="' + imgs[0] + '" alt="' + CK.esc(t.name) + '"></a>' +
      '<div class="side"><div class="info"><div class="row1"><i class="dot" style="background:' + t.hex + '"></i>' + CK.esc(t.color) +
      '・空罐系列 ' + t.series + '<span class="pre">預購</span><span class="pr">' + CK.priceText(t.price) + '</span></div>' +
      'S～2XL・United Athle 5.6oz 厚磅' + (t.model ? '<br>' + CK.esc(t.model) : '') +
      '<br><a class="size" data-prod="' + t.id + '" data-tab="size">看尺寸表</a></div>' +
      (rest.length ? '<div class="mosaic n' + rest.length + '">' + rest.map(function (s, i) {
        return '<img src="' + s + '" alt="" loading="lazy" data-prod="' + t.id + '" data-at="' + (i + 1) + '">';
      }).join('') + '</div>' : '') +
      '</div></div></section>';
  }

  document.getElementById('app').innerHTML = CK.header('T恤', ['貼紙'], LINKS) + '<main class="page">' +
    TEES.map(section).join('') + '</main>' + CK.footer();
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

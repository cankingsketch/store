<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css?v=8cbb1af8">
<link rel="stylesheet" href="shop-v3.css?v=9559091f">
<style>
  /* 課程頁樣品：內容照正式站 lessons.html，外觀套首頁／周邊頁／貼紙頁那一套（shop-v3.css）。
     照ちいかわマーケット的規則：標題幾個字＋小英文、卡片只放名稱、不寫操作說明。
     課程封面圖本身就寫了課程介紹，所以卡片不再重複那段說明，只留一行小提示 */
  .back { top:12px !important; bottom:auto !important; }
  .lsn-head { position:relative; text-align:center; margin:4px 0 22px; }
  .lsn-head h2 { font-size:30px; margin:0; font-weight:900; letter-spacing:.06em; color:var(--ink); }
  .lsn-head p.en { margin:4px 0 0; color:var(--mute); font-size:12px; font-weight:700; letter-spacing:.18em; }

  /* 開場（直條紋）：原本那張「想要學畫畫嗎？」圖＋折扣碼優惠券 */
  .lsn-top { padding:56px 16px 50px; }
  .lsn-top .intro { display:block; width:min(638px, 100%); height:auto; margin:0 auto; }
  /* 折扣碼做成優惠券（他選的 A1）：左邊票根「95折」、中間虛線撕線、撕線上下各一個半圓缺口，右邊說明＋折扣碼置中；寬度剛好包住內容。
     色彩課 HAHOW、PressPlay 兩邊都有開，折扣碼只能用在 HAHOW → 票根上放 HAHOW 綠色小標、說明寫「HAHOW 專用」（他怕有人搞混） */
  .promo-wrap { margin:26px auto 0; text-align:center; }
  .promo { --c:#fffaf3; --cut:96px; display:inline-flex; align-items:stretch; max-width:100%; border-radius:14px; text-align:center;
    background:radial-gradient(circle at var(--cut) 0, transparent 10px, var(--c) 10.5px) top / 100% 51% no-repeat,
               radial-gradient(circle at var(--cut) 100%, transparent 10px, var(--c) 10.5px) bottom / 100% 51% no-repeat;
    filter:drop-shadow(0 0 1px rgba(170,90,80,.5)) drop-shadow(0 4px 6px rgba(150,60,50,.16)); }
  .promo .stub { flex:0 0 96px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 0; }
  .promo .stub b { font-size:30px; font-weight:900; line-height:1; color:var(--red2); letter-spacing:-.02em; }
  .promo .stub b small { font-size:15px; margin-left:1px; }
  .promo .hh { margin-top:6px; padding:3px 8px; border-radius:999px; background:#16a89a; color:#fff; font-size:10.5px; font-weight:900; letter-spacing:.12em; line-height:1.2; }
  .promo .main { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:14px 22px; border-left:2px dashed #ecc3bc; }
  .promo .t { margin:0; font-size:12.5px; font-weight:700; color:#8a706b; letter-spacing:.04em; white-space:nowrap; }
  .promo .t em { font-style:normal; font-weight:900; color:#16a89a; }
  .promo .code { display:inline-flex; align-items:center; gap:10px; }
  .promo .code b { font-size:19px; font-weight:900; letter-spacing:.05em; color:var(--ink); white-space:nowrap; }
  .promo button { font:inherit; font-size:13px; font-weight:800; color:#fff; background:var(--red2); border:0; border-radius:999px;
    padding:6px 14px; cursor:pointer; transition:transform .15s; white-space:nowrap; }
  .promo button:hover { transform:translateY(-2px); }
  /* 手機：開場這段緊接在頁首下面，頁首的粗紅白直條跟這段的粗粉紅直條太像、接在一起（他反映的）→ 只有這段改成淡粉底＋細白直線（他選的 C） */
  @media (max-width:760px) {
    .band.b-stripe.lsn-top { background:#f9d9d4 repeating-linear-gradient(90deg, transparent 0 20px, rgba(255,255,255,.75) 20px 22px); }
    .promo { --cut:80px; } .promo .stub { flex-basis:80px; } .promo .stub b { font-size:25px; }
    .promo .main { padding:12px 14px; } .promo .code b { font-size:16px; } .promo .code { gap:8px; }
  }

  /* 課程（點點）：三張白卡，跟貼紙頁組合卡同一種框線＋淡紅影子 */
  .lsn-band { padding:56px 16px 64px; }
  .lsn-head .mascot { position:absolute; left:calc(50% + 110px); top:-62px; width:150px; pointer-events:none; }
  .courses { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; max-width:960px; margin:0 auto; }
  .course { background:#fff; border:1.5px solid #f1cfca; box-shadow:0 3px 12px rgba(190,60,50,.12); border-radius:22px; padding:14px 14px 18px;
    display:flex; flex-direction:column; text-align:center; }
  .course .pic { display:block; border-radius:14px; overflow:hidden; }
  .course .pic img { display:block; width:100%; aspect-ratio:1 / 1; object-fit:cover; transition:transform .3s; }
  .course .pic:hover img { transform:scale(1.04); }
  .course .nm { margin:14px 0 0; font-size:17px; font-weight:900; color:var(--ink); }
  .course .tip { margin:6px 0 0; font-size:13px; color:var(--mute); }
  .course .go { display:flex; justify-content:center; gap:8px; margin-top:auto; padding-top:14px; }
  .course .go a { min-width:104px; padding:8px 14px; border-radius:999px; font-size:14px; font-weight:800; text-decoration:none; box-sizing:border-box;
    color:#fff; background:var(--red2); border:1.5px solid var(--red2); transition:transform .15s, box-shadow .15s; }
  .course .go a.sub { color:var(--red2); background:#fff; border-color:#f1cfca; }
  .course .go a:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(255,45,45,.2); }

  @media (max-width:760px) {
    .lsn-head h2 { font-size:25px; }
    .lsn-head .mascot { width:105px; top:-44px; left:calc(50% + 78px); }
    .courses { grid-template-columns:1fr; max-width:340px; }
  }
</style>
<meta name="description" content="空罐王的繪畫課程：速寫課、色彩課。">
<link rel="canonical" href="https://cankingstore.com/lessons">
<meta property="og:site_name" content="空罐王的商店">
<meta property="og:title" content="課程">
<meta property="og:description" content="空罐王的繪畫課程：速寫課、色彩課。">
<meta property="og:url" content="https://cankingstore.com/lessons">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="stickers.js?v=d05fc16a"></script>
<script src="shared.js?v=9c2a2589"></script>
<script src="shop-v3.js?v=212ea9da"></script>
<script>
(function () {
  var IMG = 'images/';
  var LINKS = CK_SHOP.LINKS;
  var PP = 'https://www.pressplay.cc/project/6843CD5D5FEC471F6D5A9ADCEBB9AA53/about?utm_source=canking&utm_medium=YT&utm_campaign=cankingAnime&utm_content=trailer&utm_term=002';
  // [名稱, 封面, 一行提示, [[按鈕字, 連結], ...]]——連結用正式站的空罐王專屬連結
  var COURSES = [
    ['速寫課 1', 'sketchlesson01new_orig.jpg', '附英文字幕', [['HAHOW', 'https://hahow.in/cr/comicsketch']]],
    ['速寫課 2', 'sketchlesson02new_orig.jpg', '搭配速寫課 1 合購更便宜', [['HAHOW', 'https://hahow.in/cr/comicsketch2']]],
    ['色彩課', 'colorlessonnew_orig.jpg', '兩個平台都有開課', [['HAHOW', 'https://hahow.in/cr/cankingcolor1'], ['PressPlay', PP]]]
  ];
  var ext = ' target="_blank" rel="noopener"';

  document.getElementById('app').innerHTML = CK.header('課程', ['貼紙'], LINKS) + '<main class="page bands">' +
    // 開場：直條紋，原本的介紹圖＋折扣碼
    '<section class="band b-stripe lsn-top">' +
      '<img class="intro" src="' + CK_SHOP.opt('lessontopb.png', 'l') + '" alt="想要學畫畫嗎？目前我們有適合新手的三階段課程喔">' +
      '<div class="promo-wrap"><div class="promo"><div class="stub"><b>95<small>折</small></b><span class="hh">HAHOW</span></div>' +
        '<div class="main"><p class="t"><em>HAHOW 專用</em>・結帳時輸入</p>' +
        '<div class="code"><b id="ck-code">HHcankingstore</b><button type="button" id="ck-copy">複製</button></div></div></div></div>' +
    '</section>' +
    // 課程：點點底，三張白卡
    '<section class="band b-dots lsn-band"><div class="wrap">' +
      // 「繪畫課程 LESSONS」標題＋吉祥物拿掉了（他說多餘：上面開場已經講了在賣課程）
      '<div class="courses">' + COURSES.map(function (c) {
        // data-track-label：圖和下面的 HAHOW／PressPlay 按鈕都記成課名（原本按鈕記成「HAHOW」，同一堂課被拆成兩列）
        return '<div class="course" data-track-label="' + c[0] + '"><a class="pic" href="' + c[3][0][1] + '"' + ext + '><img src="' + CK_SHOP.opt(c[1]) + '" alt="' + c[0] + '"></a>' +
          '<p class="nm">' + c[0] + '</p><p class="tip">' + c[2] + '</p>' +
          '<div class="go">' + c[3].map(function (b, i) { return '<a' + (i ? ' class="sub"' : '') + ' href="' + b[1] + '"' + ext + '>' + b[0] + '</a>'; }).join('') + '</div></div>';
      }).join('') + '</div>' +
    '</div></section>' +
    '</main>' + CK.footer();
  CK_SHOP.chars();

  // 複製折扣碼：clipboard 被拒絕時退回隱藏文字框
  var btn = document.getElementById('ck-copy'), code = document.getElementById('ck-code').textContent;
  function done() { btn.textContent = '已複製'; setTimeout(function () { btn.textContent = '複製'; }, 1600); }
  function fallback() {
    var t = document.createElement('textarea'); t.value = code; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); try { if (document.execCommand('copy')) done(); } catch (e) {} t.remove();
  }
  btn.addEventListener('click', function () {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(done, fallback); else fallback();
  });
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

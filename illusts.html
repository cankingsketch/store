<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數位賣場｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css?v=8cbb1af8">
<link rel="stylesheet" href="shop-v3.css?v=9559091f">
<style>
  /* 數位賣場樣品：內容照正式站 illusts.html（Gumroad 的頻道會員獎勵，按年份分）。
     全部排開不分年份；清單即時跟正式站的 /api/gumroad 拿；拿不到（預覽站）就讀正式站的，再不行給「到 Gumroad 看全部」 */
  .top-go { margin-top:-6px; }
  .empty { text-align:center; color:var(--mute); padding:30px 0; }
</style>
<meta name="description" content="空罐王的數位賣場：Gumroad 頻道會員獎勵。">
<link rel="canonical" href="https://cankingstore.com/illusts">
<meta property="og:site_name" content="空罐王的商店">
<meta property="og:title" content="數位賣場">
<meta property="og:description" content="空罐王的數位賣場：Gumroad 頻道會員獎勵。">
<meta property="og:url" content="https://cankingstore.com/illusts">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="stickers.js?v=d05fc16a"></script>
<script src="shared.js?v=cb95b2e0"></script>
<script src="shop-v3.js?v=212ea9da"></script>
<script>
(function () {
  var STORE = 'https://cankingsketch.gumroad.com/';
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  CK_SHOP.page('數位賣場', [
    '<section class="band v3 b-dots"><div class="v3-wrap">' + CK_SHOP.head('會員獎勵', 'MEMBER REWARDS') +
      '<div class="v3-btns top-go"><a class="v3-btn" href="' + STORE + '" target="_blank" rel="noopener">前往 Gumroad</a></div>' +
      '<div style="height:30px"></div><div class="v3-grid" id="list"><p class="empty">載入中…</p></div>' +
    '</div></section>'
  ]);
  // 名稱「2026年9月份會員獎勵-1  雞腿筆刷畫雞腿」→ 卡片上只放「雞腿筆刷畫雞腿」，小字放「2026.9」
  function split(n) {
    // 名稱有好幾種寫法：「…會員獎勵-1  雞腿」「…會員獎勵1-MIKU LIVE」「…會員獎勵-空罐11月速寫練習」「…會員獎勵3-OL生日」
    var m = /^(\d{4})年(\d{1,2})月份?會員獎勵\s*\d*\s*[-－]?\s*\d*\s*(.*)$/.exec(n);
    return m ? [m[3] || n, m[1] + '.' + m[2]] : [n, ''];
  }
  // 全部排開、不分年份（他要的）：新的在前，年月放卡片小字
  function show(d) {
    document.getElementById('list').innerHTML = d.groups.reduce(function (all, g) { return all.concat(g.products); }, []).map(function (p) {
      var s = split(p.name);
      // data-track-label：統計記完整商品名（改版前就是這樣記的，前後資料才併得起來）
      return '<a class="v3-card" data-track-label="' + esc(p.name) + '" href="' + esc(p.url) + '" target="_blank" rel="noopener"><img class="pic cover" src="' + CK_SHOP.opt(p.thumb) + '"' + CK_SHOP.fallback(esc(p.thumb)) + ' alt="" loading="lazy">' +
        '<p class="nm">' + esc(s[0]) + '</p>' + (s[1] ? '<p class="sub mute">' + s[1] + '</p>' : '') + '</a>';
    }).join('');
  }
  function fail() { document.getElementById('list').innerHTML = '<p class="empty"><a href="' + STORE + '" target="_blank" rel="noopener">到 Gumroad 看全部 →</a></p>'; }
  fetch('/api/gumroad').then(function (r) { return r.json(); })
    .then(function (d) { if (!d || !d.groups || !d.groups.length) throw 0; show(d); })   // 空的也算失敗：給「到 Gumroad 看全部」
    .catch(function () { fetch('https://cankingstore.com' + '/api/gumroad').then(function (r) { return r.json(); })
      .then(function (d) { if (!d || !d.groups || !d.groups.length) throw 0; show(d); }).catch(fail); });
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

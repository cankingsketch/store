<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畫冊｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="shop-v3.css">
<style>
  /* 畫冊頁樣品：內容照正式站 3005920874.html，外觀套 v3。
     卡片只放封面＋書名＋一行年份；點了放大看內頁，購買鈕放在放大的視窗裡（卡片保持乾淨） */
  .shoprow.tapes { margin:4px auto 34px; }   /* 頂端四個入口：跟周邊頁同一款紙膠帶（他要的），下面接「實體畫冊」標題 */
</style>
<meta name="description" content="空罐王的畫冊：實體畫冊與電子版。">
<link rel="canonical" href="https://cankingstore.com/3005920874">
<meta property="og:site_name" content="空罐王的商店">
<meta property="og:title" content="畫冊">
<meta property="og:description" content="空罐王的畫冊：實體畫冊與電子版。">
<meta property="og:url" content="https://cankingstore.com/3005920874">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="stickers.js"></script>
<script src="shared.js"></script>
<script src="shop-v3.js"></script>
<script>
(function () {
  var I = CK_SHOP.IMG;
  var MYSHIP = 'https://myship.7-11.com.tw/general/detail/GM2308212736960', FORM = 'https://forms.gle/o2wVLt5KcqxdsSKd6';
  var BUY = [['711賣貨便', MYSHIP], ['海外購買', FORM, 1]];
  // [書名, 一行小字, 封面, [內頁…]]
  var PRINT = [
    ['Canking 插畫設定集 6', '2022–2024 畫集', 'vol6_orig.png', ['vol6-1_orig.png', 'vol6-2_orig.png', 'vol6-3_orig.png']],
    ['Canking 完全設定集', '2022–2023 畫集', 'editor_ck.png?1714732171', ['2023-713-10_orig.jpg', '2023-713-13_orig.jpg', 'ck-1_orig.jpg', '2023-713-18_orig.jpg']],
    ['Canking Universe', '2020–2022 畫集', 'cu_orig.png', ['cu-0005-3031_orig.png', 'cu-0006-2829_orig.png', 'cu-0013-1415_orig.png', 'cu-0015-1011_orig.png']],
    ['Canking Sketch', '2019–2020 畫集', 'cover2020.jpg?1685349297', ['006_orig.jpg', '10_orig.jpg', '8_orig.jpg', '9_orig.jpg']],
    ['Secret Letter', '2015–2017 畫集', 'editor_85629136.jpg?1685348935', ['0203-orig_orig.jpg', '0607-orig_orig.jpg', '0809-orig_orig.jpg', '1415-orig_orig.jpg']],
    ['Remembrance', 'FGO 全彩插畫本', 'editor_remembrance.jpg?1685349224', ['fgo-11_orig.jpg', 'fgo-10_orig.jpg', 'fgo12_orig.jpg']],
    ['FGO 卡片組合', '五張一組', 'fgo_orig.png', []]
  ];
  // 電子版：[書名, 小字, 封面, [內頁…], Gumroad]
  var DIGI = [
    ['DVA SKETCH', '鬥陣特攻 DVA 黑白插畫本', 'dva01_orig.jpg', ['dva02_orig.jpg', 'dva03_orig.jpg', 'dva04_orig.jpg', 'dva05_orig.jpg'], 'https://cankingsketch.gumroad.com/l/ExIhp?layout=profile'],
    ['ADDRESS', 'LOL 全彩插畫本 2', 'address01.jpg?1748535590', ['address-02_orig.jpg', 'address-03_orig.jpg', 'address-04_orig.jpg', 'address-05_orig.jpg'], 'https://cankingsketch.gumroad.com/l/znvg?layout=profile'],
    ['LOL 雜繪集', 'LOL 插畫', 'lol1.jpg?1748535972', ['lol2_orig.jpg', 'lol3_orig.jpg', 'lol4_orig.jpg', 'lol5_orig.jpg'], 'https://cankingsketch.gumroad.com/l/qKVfQ?layout=profile']
  ];
  function cards(list, kind) {
    return list.map(function (b, k) {
      return '<a class="v3-card" data-k="' + kind + k + '"><img class="pic" src="' + CK_SHOP.opt(b[2]) + '" alt="' + b[0] + '" loading="lazy">' +
        '<p class="nm">' + b[0] + '</p><p class="sub mute">' + b[1] + '</p></a>';
    }).join('');
  }
  CK_SHOP.page('畫冊', [
    '<section class="band v3 b-stripe"><div class="v3-wrap">' +
      '<div class="shoprow tapes"><span class="t"><a href="' + MYSHIP + '" target="_blank" rel="noopener">711賣貨便</a></span>' +
      '<span class="t"><a href="https://cankingsketch.gumroad.com/" target="_blank" rel="noopener">電子版</a></span>' +
      '<span class="t"><a href="events-883299.html">實體店</a></span>' +
      '<span class="t"><a href="' + FORM + '" target="_blank" rel="noopener">海外購買</a></span></div>' +
      CK_SHOP.head('實體畫冊', 'ART BOOKS') + '<div class="v3-grid">' + cards(PRINT, 'p') + '</div></div></section>',
    '<section class="band v3 b-dots"><div class="v3-wrap">' + CK_SHOP.head('電子版', 'DIGITAL') +
      '<div class="v3-grid">' + cards(DIGI, 'd') + '</div></div></section>'
  ]);
  document.getElementById('app').addEventListener('click', function (e) {
    var c = e.target.closest('.v3-card'); if (!c) return;
    var k = c.getAttribute('data-k'), d = k[0] === 'd', b = (d ? DIGI : PRINT)[+k.slice(1)];
    CK_SHOP.lightbox({ imgs: [b[2]].concat(b[3]).map(function (s) { return CK_SHOP.opt(s, 'l'); }), nm: b[0], sub: b[1],
      btns: d ? [['電子版賣場', b[4]]] : BUY });
  });
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

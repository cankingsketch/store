<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>商品後台 - 空罐王的商店</title>
<style>
  :root { --red:#ff2d2d; --line:#e6e6e6; --muted:#7b8c89; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; color:#333; background:#fafafa; }
  header { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:12px;
           padding:12px 18px; background:#fff; border-bottom:2px solid var(--red); }
  header h1 { font-size:18px; margin:0; color:var(--red); }
  header .who { font-size:12px; color:var(--muted); margin-left:auto; }
  /* 分頁切換 */
  .tabs { display:flex; gap:2px; }
  .tabs button { border:none; border-bottom:2.5px solid transparent; border-radius:0;
                 padding:8px 12px; color:var(--muted); font-weight:700; }
  .tabs button.on { color:var(--red); border-bottom-color:var(--red); }
  /* 統計 */
  .nums { display:flex; flex-wrap:wrap; gap:14px; }
  .num { flex:1 1 150px; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .num b { display:block; font-size:28px; line-height:1.2; color:#222; font-variant-numeric:tabular-nums; }
  .num span { font-size:12px; color:var(--muted); }
  .bar { display:grid; grid-template-columns:minmax(0,1fr) 130px 46px; gap:10px;
         align-items:center; padding:5px 0; font-size:14px; }
  .bar .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .tr { background:#f1f1f1; border-radius:4px; height:9px; }
  .bar .tr i { display:block; height:100%; border-radius:4px; background:var(--red); }
  .bar.dim .tr i { background:#c9c9c9; }
  .bar .vl { text-align:right; font-variant-numeric:tabular-nums; color:#555; }
  .spark { display:flex; align-items:flex-end; gap:2px; height:112px; margin:8px 0 4px; }
  /* 底軌要撐滿高度，裡面紅色長條的百分比高度才算得準 */
  .spark > div { flex:1; height:100%; background:#f4f4f4; border-radius:2px 2px 0 0; position:relative; }
  .spark > div > i { position:absolute; left:0; right:0; bottom:0; background:var(--red); border-radius:2px 2px 0 0; }
  .spark-x { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .swatch { display:inline-block; width:9px; height:9px; border-radius:2px; }
  .empty { color:var(--muted); font-size:14px; padding:4px 0; }
  .range { display:flex; gap:6px; margin-left:auto; }
  .range button { padding:5px 11px; font-size:13px; border-color:var(--line); color:#666; }
  .range button.on { border-color:var(--red); color:var(--red); }
  .cf-link { display:inline-block; font-size:14px; font-weight:700; color:var(--red); text-decoration:none;
             border:1.5px solid var(--red); border-radius:8px; padding:8px 14px; }
  .cf-link.mini { font-size:13px; padding:5px 11px; border-color:var(--line); color:var(--muted); font-weight:400; }
  .statsbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .statsbar .range { margin-left:0; }
  .statsbar .cf-link { margin-left:auto; }
  .cardhead { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:2px; }
  .cardhead h2 { margin:0; }
  /* 轉換率那張卡片要跳出來，那是兩份資料合起來才算得出的數字 */
  .num.hero { border-color:var(--red); background:#fff6f6; }
  .num.hero b { color:var(--red); }
  /* 說明文字對齊切換 */
  .align { display:flex; align-items:center; gap:6px; margin-top:7px; font-size:13px; color:var(--muted); }
  .align button { padding:4px 12px; font-size:13px; border-color:var(--line); color:#666; }
  .align button.on { border-color:var(--red); color:var(--red); font-weight:700; }
  .align .hint { margin:0; }
  /* 賣場按鈕設定 */
  .buyrow { display:flex; align-items:center; gap:10px; margin:6px 0 8px; flex-wrap:wrap; }
  .chk { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:400;
         margin:0; cursor:pointer; }
  .chk input { width:16px; height:16px; cursor:pointer; }
  .buyrow .hint { margin:0; word-break:break-all; }
  .legacy-note { background:#fff8e6; border:1px solid #ffe2a8; color:#8a6a1a;
                 border-radius:8px; padding:8px 10px; margin:0 0 4px; }
  /* 預覽裡的賣場按鈕——要跟 goods.html 的 .ck-buy 長得一樣，改了那邊記得同步 */
  .pv-buy { display:flex; align-items:center; gap:14px; margin:0 0 12px; flex-wrap:wrap; }
  .pv-buy a { text-decoration:none; }
  .pv-buy .pv-myship { display:inline-block; background:#f64c3f; color:#fff; font-size:13px;
                       line-height:1; padding:7px 16px; border-radius:999px; }
  .pv-buy .pv-shopee { font-size:14px; color:#555; border-bottom:1px solid #ccc; padding-bottom:1px; }
  button { font-family:inherit; font-size:14px; cursor:pointer; border-radius:8px; border:1.5px solid var(--red);
           background:#fff; color:var(--red); padding:8px 14px; }
  button.primary { background:var(--red); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.mini { padding:4px 9px; font-size:13px; border-radius:6px; }
  button.ghost { border-color:var(--line); color:#666; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px; }
  .cols { display:grid; grid-template-columns: 1fr 1fr; gap:18px; align-items:start; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { font-size:16px; margin:0 0 12px; }
  label { display:block; font-size:13px; font-weight:700; margin:14px 0 5px; }
  input[type=text] { width:100%; padding:9px 11px; font-size:15px; font-family:inherit;
                     border:1.5px solid var(--line); border-radius:8px; }
  input[type=text]:focus { outline:none; border-color:var(--red); }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  /* 商品清單 */
  .row { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--line);
         border-radius:9px; margin-bottom:7px; background:#fff; }
  .row .name { flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.removed { opacity:.4; }
  .row.removed .name { text-decoration:line-through; }
  .tag { font-size:11px; padding:2px 7px; border-radius:999px; background:#eee; color:#666; white-space:nowrap; }
  .row .rowthumb { width:54px; height:54px; flex:0 0 auto; border-radius:7px; background:#f5f5f5;
                   object-fit:contain; border:1px solid var(--line); }
  .row .rowthumb-none { width:54px; height:54px; flex:0 0 auto; border-radius:7px; background:#f5f5f5;
                        border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
                        font-size:10px; color:#bbb; }
  .tag.new { background:#ffe9e9; color:var(--red); }
  .tag.shop { background:#eaf3ff; color:#2b5f9e; }
  /* 圖片管理 */
  .imgs { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .thumb { width:132px; border:1px solid var(--line); border-radius:9px; padding:6px; background:#fff; }
  .thumb img { width:100%; height:88px; object-fit:contain; display:block; background:#f6f6f6; border-radius:5px; }
  .thumb .ops { display:flex; gap:3px; margin-top:5px; }
  .thumb select { flex:1; font-size:12px; padding:2px; border:1px solid var(--line); border-radius:5px; font-family:inherit; }
  .drop { margin-top:10px; border:2px dashed #ddd; border-radius:10px; padding:20px; text-align:center;
          color:var(--muted); font-size:14px; cursor:pointer; }
  .drop.over { border-color:var(--red); background:#fff5f5; color:var(--red); }
  /* 預覽 */
  .preview { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; }
  .preview .stage { border:1px dashed #ddd; border-radius:9px; padding:14px; }
  .pv-title { font-size:30px; font-weight:800; margin:0 0 12px; color:#2a2a2a; line-height:1.3; }
  .ck-prod-imgs { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:flex-start; }
  .ck-prod-imgs figure { margin:0; }
  .ck-prod-imgs img { width:100%; height:auto; display:block; border-radius:8px; }
  .ck-prod-imgs .ck-lg { flex:0 0 100%; max-width:620px; }
  .ck-prod-imgs .ck-md { flex:0 0 calc(50% - 6px); max-width:460px; }
  .ck-prod-imgs .ck-sm { flex:0 0 calc(33.333% - 8px); max-width:320px; }
  .ck-prod-desc { text-align:center; font-size:90%; margin-top:10px; color:var(--muted); }
  .ck-prod-desc.ck-desc-left { text-align:left; }
  .msg { padding:11px 14px; border-radius:9px; margin-bottom:14px; font-size:14px; display:none; }
  .msg.err { background:#ffecec; color:#c00; border:1px solid #ffc9c9; display:block; }
  .msg.ok { background:#e8f8ee; color:#127a3d; border:1px solid #b7e6c8; display:block; }
  .msg.info { background:#eef4ff; color:#1a4fa0; border:1px solid #c7d9f7; display:block; }
  @media (max-width:900px) { .cols { grid-template-columns:1fr; } }
  /* 手機上把橫條縮短，留多一點空間給名稱 */
  @media (max-width:600px) { .bar { grid-template-columns:minmax(0,1fr) 78px 40px; gap:8px; } }
  @media (max-width:600px) { .num { flex-basis:118px; padding:10px 12px; }
                             .num b { font-size:24px; } .nums { gap:10px; } }
</style>
</head>
<body>
<header>
  <h1>空罐王後台</h1>
  <div class="tabs">
    <button id="tab-goods" class="on">商品</button>
    <button id="tab-stats">流量統計</button>
  </div>
  <button id="btn-new">＋ 新增商品</button>
  <button id="btn-save" class="primary" disabled>儲存變更</button>
  <span class="who" id="who"></span>
</header>

<div class="wrap">
  <div id="msg" class="msg"></div>

  <div id="pane-goods">
  <!-- 清單模式 -->
  <div id="view-list">
    <div class="card">
      <h2>目前商品（由上到下就是網站顯示順序）</h2>
      <div id="list"></div>
      <p class="hint">新商品會加在最上面。「下架」不會馬上生效，按右上角「儲存變更」才會真的更新網站。</p>
    </div>
  </div>

  <!-- 編輯模式 -->
  <div id="view-edit" style="display:none">
    <div class="cols">
      <div class="card">
        <h2 id="edit-heading">新增商品</h2>
        <p class="hint legacy-note" id="legacy-note" style="display:none">
          這是舊版結構的商品，圖片與說明沒辦法在這裡改，但名稱與賣場按鈕可以。
        </p>
        <label>商品名稱</label>
        <input type="text" id="f-title" placeholder="例如：下雨天杯墊" />

        <label>賣場按鈕（會顯示在商品標題下方）</label>
        <div class="buyrow">
          <label class="chk"><input type="checkbox" id="f-myship" /> 賣貨便</label>
          <span class="hint" id="myship-url"></span>
        </div>
        <input type="text" id="f-shopee" placeholder="蝦皮連結（留空就不顯示蝦皮按鈕）" />
        <p class="hint" id="own-buttons-note" style="display:none"></p>

        <div id="edit-rich">
        <label>說明文字（選填）</label>
        <input type="text" id="f-desc" placeholder="例如：陶瓷 吸水 杯墊｜UV浮雕印刷" />
        <div class="align" id="f-align">
          <span>對齊：</span>
          <button type="button" data-align="center">置中</button>
          <button type="button" data-align="left">靠左</button>
          <span class="hint" id="align-auto">（目前自動判斷）</span>
        </div>
        <label>商品圖片</label>
        <div class="imgs" id="f-imgs"></div>
        <div class="drop" id="drop">點這裡選圖片，或把圖片拖進來（可一次多張）</div>
        <input type="file" id="file" accept="image/*" multiple hidden />
        <p class="hint">圖片會自動壓縮。版型：大＝獨佔一行、中＝兩張並排、小＝三張並排；手機一律單欄。</p>
        </div><!-- /edit-rich -->
        <div style="margin-top:18px; display:flex; gap:8px;">
          <button id="btn-apply" class="primary">完成，回到清單</button>
          <button id="btn-cancel" class="ghost">取消</button>
        </div>
      </div>
      <div class="preview">
        <h2 style="font-size:16px;margin:0 0 12px;">即時預覽</h2>
        <div class="stage" id="stage"></div>
        <p class="hint">這就是它在網站上的樣子（手機上多圖會自動變成上下排列）。</p>
      </div>
    </div>
  </div>
  </div><!-- /pane-goods -->

  <!-- 流量統計 -->
  <div id="pane-stats" style="display:none">
    <div class="statsbar">
      <div class="range" id="range">
        <button data-days="7" class="on">過去 7 天</button>
        <button data-days="30">30 天</button>
        <button data-days="90">90 天</button>
      </div>
      <a class="cf-link mini" target="_blank" rel="noopener"
         href="https://dash.cloudflare.com/e07fc9ba319a1f88a7c2288f0aa28933/web-analytics/overview/visits?siteTag~in=d60a99edbafd4caeaf79f96ee9499898&amp;excludeBots=Yes&amp;time-window=10080">Cloudflare 完整報表 →</a>
    </div>

    <div class="card">
      <div class="cardhead">
        <h2>網站流量</h2>
        <div class="range" id="scope">
          <button data-host="cankingstore.com" class="on">只看商店</button>
          <button data-host="">含所有子網域</button>
        </div>
      </div>
      <p class="hint" id="tf-period">載入中…</p>
      <div id="tf-body"></div>
    </div>

    <div class="card" style="margin-top:18px;">
      <div class="cardhead"><h2>購買連結點擊</h2></div>
      <p class="hint" id="st-period">載入中…</p>
      <div id="st-body"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { sha: null, products: [], dirty: false, uploads: {}, editing: null, isNewItem: false };

  function setMsg(text, kind) {
    var el = $('msg');
    el.className = 'msg' + (kind ? ' ' + kind : '');
    el.textContent = text || '';
    if (!text) el.style.display = 'none';
  }
  function markDirty() { state.dirty = true; $('btn-save').disabled = false; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 載入 ---------- */
  function load(okMsg) {
    if (!okMsg) setMsg('載入中…', 'info');
    fetch('/api/products').then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (!res.ok) { setMsg(res.d.error || '載入失敗', 'err'); return; }
      state.sha = res.d.sha;
      state.myshipUrl = res.d.myshipUrl || '';
      state.products = res.d.products.map(function (p) { p.removed = false; return p; });
      $('who').textContent = res.d.user || '';
      setMsg(okMsg || '', okMsg ? 'ok' : '');
      renderList();
    }).catch(function (e) { setMsg('連線失敗：' + e.message, 'err'); });
  }

  /* 清單縮圖：新商品用自己的第一張圖（含尚未儲存的），舊商品用後端給的路徑 */
  function thumbOf(p) {
    if (p.images && p.images.length) {
      var im = p.images[0];
      return im.dataUrl || ('images/' + im.file);
    }
    return p.thumb || '';
  }

  /* ---------- 清單 ---------- */
  function renderList() {
    var box = $('list');
    box.innerHTML = '';
    state.products.forEach(function (p, i) {
      var row = document.createElement('div');
      row.className = 'row' + (p.removed ? ' removed' : '');
      var badge = p.editable
        ? '<span class="tag new">可完整編輯</span>'
        : '<span class="tag">舊版結構' + (p.hasVideo ? '·含影片' : '') + '</span>';
      // 已經設定了哪些賣場按鈕，一眼看得出來
      var shops = '';
      if (p.myship) shops += '<span class="tag shop">賣貨便</span>';
      if (p.shopee) shops += '<span class="tag shop">蝦皮</span>';
      var src = thumbOf(p);
      var thumb = src
        ? '<img class="rowthumb" src="' + esc(src) + '" alt="" loading="lazy" />'
        : '<div class="rowthumb-none">無圖</div>';
      row.innerHTML =
        '<button class="mini ghost" data-a="up" title="上移">▲</button>' +
        '<button class="mini ghost" data-a="down" title="下移">▼</button>' +
        thumb +
        '<span class="name">' + esc(p.title) + '</span>' + badge +
        shops +
        '<button class="mini" data-a="edit">編輯</button>' +
        '<button class="mini ghost" data-a="del">' + (p.removed ? '復原' : '下架') + '</button>';
      row.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var a = b.getAttribute('data-a');
        if (a === 'up' && i > 0) { swap(i, i - 1); }
        else if (a === 'down' && i < state.products.length - 1) { swap(i, i + 1); }
        else if (a === 'del') { p.removed = !p.removed; markDirty(); renderList(); }
        else if (a === 'edit') { openEditor(i); }
      });
      box.appendChild(row);
    });
  }
  function swap(a, b) {
    var t = state.products[a]; state.products[a] = state.products[b]; state.products[b] = t;
    markDirty(); renderList();
  }

  /* ---------- 編輯器 ---------- */
  function openEditor(i) {
    state.isNewItem = (i == null);
    if (state.isNewItem) {
      state.editing = { new: true, title: '', desc: '', descAlign: null, images: [],
        editable: true, rich: true, removed: false, myship: false, shopee: '' };
      $('edit-heading').textContent = '新增商品';
    } else {
      var p = state.products[i];
      state.editing = {
        idx: i, new: !!p.new, title: p.title, desc: p.desc || '',
        descAlign: p.descAlign || null,
        images: (p.images || []).map(function (im) { return { file: im.file, size: im.size, dataUrl: im.dataUrl }; }),
        // 舊版結構只能改名稱與賣場按鈕，圖片／說明藏起來
        editable: true, rich: !!p.editable, removed: false, origIdx: p.idx,
        myship: !!p.myship, shopee: p.shopee || '', ownButtons: !!p.ownButtons
      };
      $('edit-heading').textContent = '編輯商品';
    }
    var e = state.editing;
    $('f-title').value = e.title;
    $('f-desc').value = e.desc;
    $('f-myship').checked = !!e.myship;
    $('f-shopee').value = e.shopee;
    $('edit-rich').style.display = e.rich ? '' : 'none';
    $('legacy-note').style.display = e.rich ? 'none' : '';
    $('myship-url').textContent = state.myshipUrl ? '→ ' + state.myshipUrl : '（找不到賣貨便網址）';
    $('own-buttons-note').style.display = e.ownButtons ? '' : 'none';
    $('own-buttons-note').textContent = e.ownButtons
      ? '注意：這個商品本來就有自己的按鈕，再加可能會重複。' : '';
    renderImgs(); renderPreview();
    $('view-list').style.display = 'none';
    $('view-edit').style.display = '';
  }
  function closeEditor() {
    state.editing = null;
    $('view-edit').style.display = 'none';
    $('view-list').style.display = '';
    renderList();
  }
  function imgSrc(im) { return im.dataUrl || ('images/' + im.file); }

  function renderImgs() {
    var box = $('f-imgs'); box.innerHTML = '';
    state.editing.images.forEach(function (im, i) {
      var d = document.createElement('div');
      d.className = 'thumb';
      d.innerHTML =
        '<img src="' + imgSrc(im) + '" alt="" />' +
        '<div class="ops">' +
          '<button class="mini ghost" data-a="l" title="左移">◀</button>' +
          '<select data-a="size">' +
            '<option value="lg">大</option><option value="md">中</option><option value="sm">小</option>' +
          '</select>' +
          '<button class="mini ghost" data-a="r" title="右移">▶</button>' +
          '<button class="mini ghost" data-a="x" title="移除">✕</button>' +
        '</div>';
      d.querySelector('select').value = im.size || 'lg';
      d.addEventListener('change', function (e) {
        if (e.target.getAttribute('data-a') === 'size') { im.size = e.target.value; renderPreview(); }
      });
      d.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var a = b.getAttribute('data-a'), arr = state.editing.images;
        if (a === 'l' && i > 0) { arr.splice(i - 1, 0, arr.splice(i, 1)[0]); }
        else if (a === 'r' && i < arr.length - 1) { arr.splice(i + 1, 0, arr.splice(i, 1)[0]); }
        else if (a === 'x') { arr.splice(i, 1); }
        renderImgs(); renderPreview();
      });
      box.appendChild(d);
    });
  }

  /* 沒有明講對齊時的自動規則：有並排圖就靠左，單張大圖置中。
     必須與 functions/api/products.js 的 buildBlock 一致。 */
  function autoAlign(images) {
    return images.some(function (im) { return im.size === 'md' || im.size === 'sm'; }) ? 'left' : 'center';
  }
  function effectiveAlign(e) {
    return e.descAlign === 'left' || e.descAlign === 'center' ? e.descAlign : autoAlign(e.images);
  }
  function renderAlign() {
    var e = state.editing; if (!e) return;
    var cur = effectiveAlign(e);
    Array.prototype.forEach.call($('f-align').querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-align') === cur);
    });
    $('align-auto').style.display =
      e.descAlign === 'left' || e.descAlign === 'center' ? 'none' : '';
  }

  /* 預覽裡的賣場按鈕，配色比照網站上的 wsite-button */
  function buyPreview(e) {
    var out = '';
    if (e.myship) out += '<a class="pv-myship">賣貨便</a>';
    if (e.shopee) out += '<a class="pv-shopee">蝦皮</a>';
    return out ? '<div class="pv-buy">' + out + '</div>' : '';
  }

  function renderPreview() {
    var e = state.editing; if (!e) return;
    var imgs = e.images.map(function (im) {
      return '<figure class="ck-img ck-' + (im.size || 'lg') + '"><img src="' + imgSrc(im) + '" alt="" /></figure>';
    }).join('');
    var descCls = 'ck-prod-desc' + (effectiveAlign(e) === 'left' ? ' ck-desc-left' : '');
    renderAlign();
    $('stage').innerHTML =
      '<h3 class="pv-title">' + (esc(e.title) || '<span style="color:#bbb">（商品名稱）</span>') + '</h3>' +
      buyPreview(e) +
      '<div class="ck-prod"><div class="ck-prod-imgs">' + imgs + '</div>' +
      (e.desc.trim() ? '<div class="' + descCls + '">' + esc(e.desc) + '</div>' : '') + '</div>';
  }

  /* ---------- 圖片壓縮 ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function stamp() {
    var d = new Date();
    return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  function compress(file, seq) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var maxW = 1400;
          var scale = Math.min(1, maxW / img.width);
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: c.toDataURL('image/jpeg', 0.85), file: 'prod-' + stamp() + '-' + seq + '.jpg' });
        };
        img.onerror = function () { reject(new Error('圖片讀取失敗')); };
        img.src = fr.result;
      };
      fr.onerror = function () { reject(new Error('檔案讀取失敗')); };
      fr.readAsDataURL(file);
    });
  }
  function addFiles(files) {
    var list = [].slice.call(files).filter(function (f) { return /^image\//.test(f.type); });
    if (!list.length) return;
    setMsg('處理圖片中…', 'info');
    Promise.all(list.map(function (f, i) { return compress(f, i + 1); })).then(function (res) {
      res.forEach(function (r) {
        state.editing.images.push({ file: r.file, size: 'lg', dataUrl: r.dataUrl });
        state.uploads[r.file] = r.dataUrl.split(',')[1];
      });
      setMsg(''); renderImgs(); renderPreview();
    }).catch(function (e) { setMsg(e.message, 'err'); });
  }

  /* ---------- 儲存 ---------- */
  function save() {
    var keep = state.products.filter(function (p) { return !p.removed; });
    if (!keep.length) { setMsg('至少要保留一個商品。', 'err'); return; }
    var bad = keep.filter(function (p) { return p.new && !p.images.length; });
    if (bad.length) { setMsg('「' + bad[0].title + '」還沒有圖片。', 'err'); return; }

    var used = {};
    var items = keep.map(function (p) {
      if (p.new) {
        (p.images || []).forEach(function (im) { used[im.file] = 1; });
        return { new: true, title: p.title, desc: p.desc || '', descAlign: p.descAlign || null,
                 myship: !!p.myship, shopee: p.shopee || '',
                 images: p.images.map(function (im) { return { file: im.file, size: im.size }; }) };
      }
      var o = { idx: p.idx, title: p.title, myship: !!p.myship, shopee: p.shopee || '' };
      if (p.editable) {
        o.desc = p.desc || '';
        o.descAlign = p.descAlign || null;
        o.images = (p.images || []).map(function (im) { used[im.file] = 1; return { file: im.file, size: im.size }; });
      }
      return o;
    });
    var uploads = {};
    Object.keys(state.uploads).forEach(function (k) { if (used[k]) uploads[k] = state.uploads[k]; });

    $('btn-save').disabled = true;
    setMsg('儲存中，請稍候…', 'info');
    fetch('/api/products', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: state.sha, items: items, uploads: uploads })
    }).then(function (r) {
      return r.json().then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (!res.ok) { setMsg(res.d.error || '儲存失敗', 'err'); $('btn-save').disabled = false; return; }
      state.dirty = false; state.uploads = {};
      load('已儲存！網站約 1～2 分鐘後更新完成。');
    }).catch(function (e) { setMsg('儲存失敗：' + e.message, 'err'); $('btn-save').disabled = false; });
  }

  /* ---------- 綁定 ---------- */
  $('btn-new').addEventListener('click', function () { openEditor(null); });
  $('btn-save').addEventListener('click', save);
  $('btn-cancel').addEventListener('click', closeEditor);
  $('f-title').addEventListener('input', function () { state.editing.title = this.value; renderPreview(); });
  $('f-desc').addEventListener('input', function () { state.editing.desc = this.value; renderPreview(); });
  $('f-myship').addEventListener('change', function () { state.editing.myship = this.checked; renderPreview(); });
  $('f-shopee').addEventListener('input', function () { state.editing.shopee = this.value.trim(); renderPreview(); });
  $('f-align').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-align]');
    if (!b || !state.editing) return;
    // 按下之後就是明講的，不再跟著圖片版型自動變
    state.editing.descAlign = b.getAttribute('data-align');
    renderPreview();
  });
  $('btn-apply').addEventListener('click', function () {
    var e = state.editing;
    if (!e.title.trim()) { setMsg('請填寫商品名稱。', 'err'); return; }
    // 舊版商品沒辦法在這裡管圖片，不能拿「至少一張圖」去要求它
    if (e.rich && !e.images.length) { setMsg('請至少上傳一張圖片。', 'err'); return; }
    if (e.shopee && !/^https?:\/\//i.test(e.shopee)) {
      setMsg('蝦皮連結要以 http:// 或 https:// 開頭。', 'err'); return;
    }
    setMsg('');
    if (state.isNewItem) {
      state.products.unshift({ new: true, title: e.title.trim(), desc: e.desc.trim(),
        descAlign: e.descAlign || null, images: e.images, editable: true, removed: false,
        myship: !!e.myship, shopee: e.shopee || '' });
    } else {
      var p = state.products[e.idx];
      p.title = e.title.trim();
      p.myship = !!e.myship; p.shopee = e.shopee || '';
      if (e.rich) {
        p.desc = e.desc.trim(); p.images = e.images;
        p.descAlign = e.descAlign || null;
      }
    }
    markDirty(); closeEditor();
  });
  $('drop').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  ['dragenter', 'dragover'].forEach(function (t) {
    $('drop').addEventListener(t, function (e) { e.preventDefault(); this.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    $('drop').addEventListener(t, function (e) { e.preventDefault(); this.classList.remove('over'); });
  });
  $('drop').addEventListener('drop', function (e) { addFiles(e.dataTransfer.files); });
  window.addEventListener('beforeunload', function (e) {
    if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  load();
})();
</script>

<script>
/* 流量統計分頁：讀 /api/track 記下的外連點擊 */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var days = 7, loadedFor = null, busy = false;
  var host = 'cankingstore.com', tfLoadedFor = null, tfBusy = false;
  var lastTraffic = null, lastShopClicks = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* 一組橫條排行；rows = [{ nm, n, dim }] */
  function barList(rows) {
    if (!rows || !rows.length) return '<p class="empty">這段期間沒有資料。</p>';
    var max = rows.reduce(function (m, r) { return Math.max(m, r.n); }, 0) || 1;
    return rows.map(function (r) {
      return '<div class="bar' + (r.dim ? ' dim' : '') + '">' +
        '<div class="nm" title="' + esc(r.nm) + '">' + esc(r.nm) + '</div>' +
        '<div class="tr"><i style="width:' + Math.max(2, (r.n / max) * 100) + '%"></i></div>' +
        '<div class="vl">' + r.n + '</div></div>';
    }).join('');
  }

  function section(title, inner) {
    return '<h2 style="font-size:15px;margin:22px 0 6px;">' + title + '</h2>' + inner;
  }

  /* 每日長條圖；補上沒有點擊的日子，不然圖會誤導 */
  function spark(byDay, from, to) {
    var have = {};
    (byDay || []).forEach(function (d) { have[d.day] = d.n; });
    var out = [], cur = new Date(from + 'T00:00:00Z'), end = new Date(to + 'T00:00:00Z');
    while (cur <= end && out.length < 400) {
      var k = cur.toISOString().slice(0, 10);
      out.push({ day: k, n: have[k] || 0 });
      cur.setUTCDate(cur.getUTCDate() + 1);
    }
    var max = out.reduce(function (m, d) { return Math.max(m, d.n); }, 0) || 1;
    return '<div class="spark">' + out.map(function (d) {
      return '<div title="' + d.day + '：' + d.n + ' 次"><i style="height:' +
        (d.n ? Math.max(3, (d.n / max) * 100) : 0) + '%"></i></div>';
    }).join('') + '</div>' +
      '<div class="spark-x"><span>' + out[0].day + '</span>' +
      '<span>最高一天 ' + max + ' 次</span>' +
      '<span>' + out[out.length - 1].day + '</span></div>';
  }

  function render(d) {
    if (d.ready === false) {
      $('st-period').textContent = '';
      $('st-body').innerHTML = '<p class="empty">' + esc(d.message || '尚未啟用。') + '</p>';
      return;
    }
    if (!d.total) {
      $('st-period').textContent = d.from ? d.from + ' ～ ' + d.to : '';
      $('st-body').innerHTML = '<p class="empty">這段期間還沒有人點過購買連結。' +
        '（追蹤剛上線的話，要等有人實際點擊才會有數字）</p>';
      return;
    }
    $('st-period').textContent = d.from + ' ～ ' + d.to + '（台灣時間）';

    var perDay = (d.shop / d.days).toFixed(1);
    var html =
      '<div class="nums">' +
        '<div class="num"><b>' + d.shop + '</b><span>購買連結點擊</span></div>' +
        '<div class="num"><b>' + perDay + '</b><span>平均每天</span></div>' +
        '<div class="num"><b>' + d.total + '</b><span>所有外連點擊（含社群）</span></div>' +
      '</div>';

    html += section('每日點擊', spark(d.byDay, d.from, d.to));

    html += section('哪個通路被點最多',
      barList((d.byChannel || []).map(function (r) {
        return { nm: r.channel + (r.kind === 'shop' ? '' : '（社群/其他）'), n: r.n, dim: r.kind !== 'shop' };
      })) +
      '<p class="hint"><span class="swatch" style="background:#ff2d2d"></span> 購買通路　' +
      '<span class="swatch" style="background:#c9c9c9"></span> 社群連結</p>');

    html += section('哪個商品的購買鍵被按最多',
      barList((d.byLabel || []).map(function (r) { return { nm: r.label, n: r.n }; })));

    html += section('從哪一頁點出去',
      barList((d.byPage || []).map(function (r) { return { nm: r.page || '（首頁）', n: r.n }; })));

    var dev = d.byDevice || [], ctry = d.byCountry || [];
    html += '<div class="cols" style="margin-top:4px;"><div>' +
      section('裝置', barList(dev.map(function (r) {
        return { nm: deviceName(r.device), n: r.n };
      }))) + '</div><div>' +
      section('國家地區', barList(ctry.map(function (r) { return { nm: countryName(r.country), n: r.n }; }))) +
      '</div></div>';

    $('st-body').innerHTML = html;
    lastShopClicks = d.shop;
    renderNums();
  }

  /* Cloudflare 兩邊回傳的都是國家代碼，換成看得懂的名字（沒收錄的就照原樣顯示） */
  var COUNTRY = {
    TW: '台灣', HK: '香港', MO: '澳門', CN: '中國', JP: '日本', KR: '韓國',
    SG: '新加坡', MY: '馬來西亞', TH: '泰國', VN: '越南', PH: '菲律賓', ID: '印尼',
    IN: '印度', US: '美國', CA: '加拿大', MX: '墨西哥', BR: '巴西',
    GB: '英國', DE: '德國', FR: '法國', NL: '荷蘭', ES: '西班牙', IT: '義大利',
    PL: '波蘭', SE: '瑞典', RU: '俄羅斯', AU: '澳洲', NZ: '紐西蘭'
  };
  function deviceName(d) {
    return { mobile: '手機', desktop: '桌機', tablet: '平板' }[d] || d || '（未知）';
  }
  function countryName(code) {
    var c = String(code || '').toUpperCase();
    return COUNTRY[c] ? COUNTRY[c] + '（' + c + '）' : (code || '（未知）');
  }

  /* ---------- 網站流量（Cloudflare Web Analytics） ---------- */

  function trafficBars(list, key) {
    return barList((list || []).map(function (r) {
      return { nm: r.name || '（未知）', n: r[key || 'visits'] };
    }));
  }

  /* 造訪 → 按購買鍵 → 轉換率。兩份資料是分開載入的，
     所以誰先到都要能正確重畫這一列。 */
  function renderNums() {
    var el = $('tf-nums');
    if (!el || !lastTraffic) return;
    var d = lastTraffic;
    var cards =
      '<div class="num"><b>' + d.visits + '</b><span>造訪次數</span></div>' +
      '<div class="num"><b>' + d.views + '</b><span>頁面瀏覽</span></div>';
    if (lastShopClicks != null) {
      var rate = d.visits ? (lastShopClicks / d.visits * 100) : 0;
      cards += '<div class="num"><b>' + lastShopClicks + '</b><span>按了購買連結</span></div>' +
               '<div class="num hero"><b>' + rate.toFixed(1) + '%</b><span>轉換率</span></div>';
    }
    var perDay = d.days ? (d.visits / d.days) : 0;
    el.innerHTML = '<div class="nums">' + cards + '</div>' +
      '<p class="hint">平均每天 ' + perDay.toFixed(1) + ' 次造訪' +
      (lastShopClicks != null && d.visits
        ? '；每 100 次造訪約有 ' + (lastShopClicks / d.visits * 100).toFixed(1) + ' 次點了購買連結'
        : '') +
      (d.host ? '。' : '。（目前含所有子網域，轉換率會被稀釋）') + '</p>';
  }

  function renderTraffic(d) {
    if (d.ready === false) {
      $('tf-period').textContent = '';
      $('tf-body').innerHTML =
        '<p class="empty">' + esc(d.message || '尚未啟用。') +
        '<br>設定好之後這裡就會顯示造訪數、來源網站、國家與每日走勢。</p>';
      lastTraffic = null;
      return;
    }
    $('tf-period').textContent = d.from + ' ～ ' + d.to + '（台灣時間）' +
      (d.host ? '｜只計 ' + d.host : '｜含所有子網域') +
      (d.excludes ? '｜已排除 ' + d.excludes : '') + (d.cached ? '｜快取' : '');
    lastTraffic = d;

    var html = '<div id="tf-nums"></div>';

    // 每日走勢：後端已經把沒有流量的日子補成 0，直接畫
    var max = (d.byDay || []).reduce(function (m, x) { return Math.max(m, x.visits); }, 0) || 1;
    html += section('每日造訪',
      '<div class="spark">' + (d.byDay || []).map(function (x) {
        return '<div title="' + x.day + '：' + x.visits + ' 次造訪／' + x.views + ' 頁"><i style="height:' +
          (x.visits ? Math.max(3, x.visits / max * 100) : 0) + '%"></i></div>';
      }).join('') + '</div>' +
      '<div class="spark-x"><span>' + (d.byDay[0] || {}).day + '</span>' +
      '<span>最高一天 ' + max + ' 次</span>' +
      '<span>' + (d.byDay[d.byDay.length - 1] || {}).day + '</span></div>');

    html += section('從哪個網站來', trafficBars(d.referers));
    html += section('熱門頁面', trafficBars(d.paths));

    html += '<div class="cols" style="margin-top:4px;"><div>' +
      section('國家地區', trafficBars((d.countries || []).map(function (r) {
        return { name: countryName(r.name), visits: r.visits };
      }))) + '</div><div>' +
      section('裝置', trafficBars((d.devices || []).map(function (r) {
        return { name: deviceName(r.name), visits: r.visits };
      }))) + '</div></div>';

    if (!d.host && (d.hosts || []).length > 1) {
      html += section('各子網域', trafficBars(d.hosts));
    }

    $('tf-body').innerHTML = html;
    renderNums();
  }

  function loadTraffic(force) {
    var key = days + '|' + host;
    if (tfBusy || (!force && tfLoadedFor === key)) return;
    tfBusy = true;
    $('tf-period').textContent = '載入中…';
    fetch('/api/traffic?days=' + days + (host ? '&host=' + encodeURIComponent(host) : ''),
      { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) throw new Error(d.error);
        tfLoadedFor = key;
        renderTraffic(d);
      })
      .catch(function (e) {
        $('tf-period').textContent = '';
        $('tf-body').innerHTML = '<p class="empty">讀取失敗：' + esc(e.message || e) + '</p>';
      })
      .then(function () { tfBusy = false; });
  }

  function load(force) {
    if (busy || (!force && loadedFor === days)) return;
    busy = true;
    $('st-period').textContent = '載入中…';
    fetch('/api/stats?days=' + days, { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) throw new Error(d.error);
        loadedFor = days;
        render(d);
      })
      .catch(function (e) {
        $('st-period').textContent = '';
        $('st-body').innerHTML = '<p class="empty">讀取失敗：' + esc(e.message || e) + '</p>';
      })
      .then(function () { busy = false; });
  }

  /* 分頁切換 */
  function show(which) {
    var stats = which === 'stats';
    $('pane-goods').style.display = stats ? 'none' : '';
    $('pane-stats').style.display = stats ? '' : 'none';
    $('tab-goods').classList.toggle('on', !stats);
    $('tab-stats').classList.toggle('on', stats);
    // 統計頁用不到這兩顆，藏起來免得誤按
    $('btn-new').style.display = stats ? 'none' : '';
    $('btn-save').style.display = stats ? 'none' : '';
    if (stats) { loadTraffic(); load(); }
  }
  $('tab-goods').addEventListener('click', function () { show('goods'); });
  $('tab-stats').addEventListener('click', function () { show('stats'); });

  $('range').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-days]');
    if (!b) return;
    days = parseInt(b.getAttribute('data-days'), 10);
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    load(true);
    loadTraffic(true);
  });

  /* 「只看商店 / 含所有子網域」——planner、pos、ar 也掛在同一個網站標籤下，
     算商店成效時要能把它們排除掉 */
  $('scope').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-host]');
    if (!b) return;
    host = b.getAttribute('data-host');
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
    loadTraffic(true);
  });
})();
</script>
</body>

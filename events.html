<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活動｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css?v=8cbb1af8">
<link rel="stylesheet" href="shop-v3.css?v=9559091f">
<style>
  /* 活動頁樣品：資料跟正式站同一份（指揮部推送的 events-live.js＋手動的 events-data.js），
     結束日還沒過 → 近期活動（大張日期卡，跟首頁一樣）；過了 → 過往活動（按年份切換的小卡） */
  .ev { list-style:none; margin:0 auto; padding:0; max-width:820px; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; }
  .ev li { display:flex; align-items:center; gap:14px; border-radius:20px; padding:18px 20px; text-align:left; }
  .ev .d { flex:none; text-align:center; padding-right:16px; border-right:2px dashed #f1cfca; line-height:1.1; min-width:86px; }
  .ev .d small { display:block; font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--mute); }
  .ev .d b { display:block; font-size:30px; font-weight:900; color:var(--red2); letter-spacing:.02em; margin:2px 0; }
  .ev .d span { display:block; font-size:13px; color:#666; }
  .ev .n b { display:block; font-size:19px; font-weight:900; color:var(--ink); line-height:1.3; }
  .ev .n small { display:block; margin-top:4px; font-size:14px; color:#555; }
  .past { list-style:none; margin:0 auto; padding:0; max-width:820px; display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; }
  .past li { display:flex; align-items:baseline; gap:12px; background:#fff; border:1.5px solid #f1cfca; border-radius:16px; padding:12px 16px; }
  .past li span { flex:none; font-size:13px; font-weight:700; color:var(--mute); min-width:74px; }
  .past li b { font-size:15px; font-weight:800; color:var(--ink); }
  .empty { text-align:center; color:var(--mute); }
</style>
<meta name="description" content="空罐王近期與過往的展覽活動。">
<link rel="canonical" href="https://cankingstore.com/events">
<meta property="og:site_name" content="空罐王的商店">
<meta property="og:title" content="活動">
<meta property="og:description" content="空罐王近期與過往的展覽活動。">
<meta property="og:url" content="https://cankingstore.com/events">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="events-live.js"></script>
<script src="events-data.js"></script>
<script src="stickers.js?v=d05fc16a"></script>
<script src="shared.js?v=3dd732b4"></script>
<script src="shop-v3.js?v=212ea9da"></script>
<script>
(function () {
  // 兩份合併、分預定／過往：共用的 CK_SHOP.events()（首頁的近期活動也用它）
  var ev = CK_SHOP.events(), up = ev.up, past = ev.past;
  var years = []; past.forEach(function (e) { var y = e.end.slice(0, 4); if (years.indexOf(y) < 0) years.push(y); });

  CK_SHOP.page('', [
    '<section class="band v3 b-stripe"><div class="v3-wrap">' + CK_SHOP.head('近期活動', 'EVENTS') +
      (up.length ? '<ul class="ev">' + up.map(function (e) {
        var p = e.p;
        return '<li class="white-box"><div class="d"><small>' + p[0] + '</small><b>' + p[1] + '</b>' + (p[2] ? '<span>～' + p[2] + '</span>' : '') + '</div>' +
          '<div class="n"><b>' + CK.esc(e.name) + '</b>' + (e.booth ? '<small>攤位 ' + CK.esc(e.booth) + '</small>' : '') + '</div></li>';
      }).join('') + '</ul>' : '<p class="empty">敬請期待</p>') +
    '</div></section>',
    '<section class="band v3 b-dots"><div class="v3-wrap">' + CK_SHOP.head('過往活動', 'PAST EVENTS') +
      '<div class="v3-chips" id="years"></div><ul class="past" id="past"></ul></div></section>'
  ]);
  var cur = 0, yb = document.getElementById('years'), list = document.getElementById('past');
  function draw() {
    yb.innerHTML = years.map(function (y, k) { return '<button class="' + (k === cur ? 'on' : '') + '" data-k="' + k + '">' + y + '</button>'; }).join('');
    list.innerHTML = past.filter(function (e) { return e.end.slice(0, 4) === years[cur]; }).map(function (e) {
      var p = e.p;
      return '<li><span>' + p[1] + (p[2] ? '–' + p[2] : '') + '</span><b>' + CK.esc(e.name) + '</b></li>';
    }).join('');
  }
  yb.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { cur = +b.getAttribute('data-k'); draw(); } });
  if (years.length) draw();
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客製化商品｜空罐王的商店</title>
<link rel="stylesheet" href="shared.css?v=8cbb1af8">
<link rel="stylesheet" href="shop-v3.css?v=9559091f">
<style>
  /* 客製化商品樣品：內容照正式站（客製信用卡造型卡片）。商品一大框 → 作品 → 怎麼訂 → 開箱影片 */
  .cc { display:grid; grid-template-columns:1.25fr 1fr; gap:28px; align-items:center; padding:18px; border-radius:28px; max-width:960px; margin:0 auto; }
  .cc .hero { display:block; width:100%; border-radius:18px; cursor:zoom-in; }
  .cc .info { text-align:left; padding-right:10px; }
  .cc h1 { margin:0; font-size:26px; font-weight:900; color:var(--ink); line-height:1.3; }
  .cc .lead { margin:8px 0 0; font-size:14px; color:var(--mute); line-height:1.6; }
  .cc .price { margin:16px 0 0; font-size:22px; font-weight:400; color:var(--ink); }
  .cc .price small { font-size:13px; color:var(--mute); margin-left:6px; }
  .cc .v3-btns { justify-content:flex-start; margin-top:18px; }
  .cc .warn { margin:16px 0 0; padding:10px 14px; border-radius:14px; background:#fff4f2; font-size:13px; line-height:1.6; color:#a0443a; }
  .works { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
  .works img { display:block; width:100%; aspect-ratio:1 / 1; object-fit:cover; border-radius:16px; background:#fff; cursor:zoom-in;
    border:1.5px solid #f1cfca; box-shadow:0 3px 12px rgba(190,60,50,.12); transition:transform .15s; }
  .works img:hover { transform:translateY(-3px); }
  .steps { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  .step { padding:22px 18px 20px; border-radius:22px; text-align:center; }
  .step .n { width:34px; height:34px; margin:0 auto; border-radius:50%; background:var(--red2); color:#fff; font-weight:900; display:grid; place-items:center; }
  .step b { display:block; margin-top:10px; font-size:17px; font-weight:800; color:var(--ink); }
  .step p { margin:6px 0 0; font-size:13.5px; line-height:1.65; color:#555; }
  .fine { margin:16px auto 0; max-width:760px; text-align:center; font-size:12.5px; color:#8a6f6b; line-height:1.6; }
  @media (max-width:760px) {
    .cc { grid-template-columns:1fr; gap:16px; padding:12px; }
    .cc .info { padding:0 6px 8px; }
    .works { grid-template-columns:repeat(2, 1fr); gap:10px; }
    .steps { grid-template-columns:1fr; }
  }
</style>
<meta name="description" content="客製信用卡造型卡片：實體卡片＋電子錢包。">

<meta property="og:image" content="https://cankingstore.com/images/og_share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app"></div>
<script src="stickers.js?v=d05fc16a"></script>
<script src="shared.js?v=64a4c608"></script>
<script src="shop-v3.js?v=212ea9da"></script>
<script>
(function () {
  var I = CK_SHOP.IMG;
  var ORDER = 'https://myship.7-11.com.tw/general/detail/GM2511047746521';
  var FORM = 'https://docs.google.com/forms/d/e/1FAIpQLScSby_K4IcfKt6PzrkKCd8uPJuXqb5oay4hxZ-2bgY1BbzjHw/viewform?usp=send_form';
  var REEL = 'https://www.instagram.com/reel/DPv8sVtEm5O/';
  var WORKS = ['cashcard-2.png', 'cashcard-3.png', 'cashcard-5.png', 'cashcard-6.png', 'cashcard-7.png', 'cashcard-8.png'];
  var STEPS = [['下單', '賣貨便付排單費 20 元＋運費 38 元，再填客製內容表單。'],
               ['確認', '匯款 1,980 元，我做好電子樣品圖給你確認，可修改一次。'],
               ['製作出貨', '約 7–10 個工作天，出貨後 Email 通知。']];
  CK_SHOP.page('客製化商品', [
    '<section class="band v3 b-stripe"><div class="cc white-box">' +
      '<img class="hero" src="' + CK_SHOP.opt('cashcard-hero.jpg', 'l') + '" alt="客製信用卡造型卡片" data-w="-1">' +
      '<div class="info"><h1>客製信用卡造型卡片</h1><p class="lead">實體卡片＋電子錢包<br>信封、卡片、手機錢包上的文字都能客製</p>' +
        '<p class="price">NT$2,000<small>＋運費 38</small></p>' +
        '<div class="v3-btns"><a class="v3-btn" href="' + ORDER + '" target="_blank" rel="noopener">711賣貨便下單</a>' +
        '<a class="v3-btn sub" href="' + FORM + '" target="_blank" rel="noopener">海外表單</a></div>' +
        '<p class="warn">手工製作，每月只開放少量預購。製作約 7–10 個工作天，送禮請抓好日期。</p></div>' +
    '</div></section>',
    '<section class="band v3 b-dots"><div class="v3-wrap">' + CK_SHOP.head('作品', 'WORKS') +
      '<div class="works">' + WORKS.map(function (s, k) { return '<img src="' + CK_SHOP.opt(s) + '" alt="客製卡片作品" loading="lazy" data-w="' + k + '">'; }).join('') + '</div>' +
      '<div class="v3-btns" style="margin-top:24px"><a class="v3-btn sub" href="' + REEL + '" target="_blank" rel="noopener">▶ 開箱影片</a></div>' +
    '</div></section>',
    '<section class="band v3 b-stripe"><div class="v3-wrap">' + CK_SHOP.head('怎麼訂', 'HOW TO ORDER') +
      '<div class="steps">' + STEPS.map(function (s, k) {
        return '<div class="step white-box"><div class="n">' + (k + 1) + '</div><b>' + s[0] + '</b><p>' + s[1] + '</p></div>';
      }).join('') + '</div>' +
      '<p class="fine">※ 可放入 Apple 錢包及 Google 錢包，沒有扣款功能（扣款是平台端的擴充功能，需另付月費）。</p>' +
    '</div></section>'
  ]);
  var ALL = ['cashcard-hero.jpg'].concat(WORKS).map(function (s) { return CK_SHOP.opt(s, 'l'); });
  document.getElementById('app').addEventListener('click', function (e) {
    var w = e.target.getAttribute && e.target.getAttribute('data-w'); if (w == null) return;
    CK_SHOP.lightbox({ imgs: ALL }, +w + 1);
  });
})();
</script>
<script defer src="/track.js"></script>
</body>
</html>

<script>
setTimeout(() => {
  let elBacktop = document.getElementById('ns-backtop');
  let isShow = false;
  elBacktop.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: 'smooth',
    });
  });

  function debounce(fn, delay = 500) {
    let timer;
  
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        fn(...args);
      }, delay);
    };
  }

  const onScroll = debounce(() => {
    if (window.scrollY > 100) {
      if (!isShow) {
        elBacktop.classList.add('show');
        isShow = true;
      }
    } else {
	  if (isShow) {
	    elBacktop.classList.remove('show');
		isShow = false;
	  }
    }
  }, 100);

  window.addEventListener('scroll', onScroll);
});

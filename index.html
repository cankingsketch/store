    <script>
      setTimeout(() => {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        const STORE_KEY = {
          BANNER_DOLL_COUNT: 'BANNER_DOLL_COUNT',
        };
        // const COUNT_THRESHELD = 100;
        // const COUNT_LIMIT = 9999999;
        const COUNT_THRESHELD = 100;
        const COUNT_LIMIT = 999999;

        let clickAudioPoint = 0;
        const clickAudios = [];
        for (let i = 0; i < 10; i++) clickAudios.push(new Audio('images/on_click.mp3'));
        function playClickAudio() {
          console.log(clickAudioPoint);
          clickAudios[clickAudioPoint].play();
          clickAudioPoint++;
          clickAudioPoint %= 10;
        }

        const mousePos = {
          x: 0,
          y: 0,
        };

        /* 你知道的太多了 */
        const coupons = [
          {
            label: '賣便貨1元',
            code: 'AJSKUYH6',
          },
          {
            label: '賣便貨5元',
            code: 'H7JDDPER',
          },
          {
            label: '賣便貨10元',
            code: 'RYLSGP3R',
          },          
        ];

        let couponCount = +sessionStorage.getItem(STORE_KEY.BANNER_DOLL_COUNT) || 0;
        // let couponCount = 0;
        let isExceedCouponCountThreshold = false;

        const clickAreaCursorEl = document.querySelector('.ns-banner2 .ns-banner2-click-area-cursor');

        const counterEl = document.querySelector('.ns-banner2 .click-counter');
        const counterValueEl = document.querySelector('.ns-banner2 .click-counter-value');
        counterValueEl.innerText = couponCount;
        const countExceedLimitEl = document.querySelector('.ns-banner2 .img-exceed-limit');

        // const couponEl = document.querySelector('.coupon-wrap');

        const mainImg1El = document.querySelector('.ns-banner2 .img-main .img-main-1');
        const mainImg2El = document.querySelector('.ns-banner2 .img-main .img-main-2');
        const mainImg3El = document.querySelector('.ns-banner2 .img-main .img-main-3');
        const mainImg4El = document.querySelector('.ns-banner2 .img-main .img-main-4');
        const smokeEl = document.querySelector('.ns-banner2 .img-smoke');

        const couponContainerEl = document.querySelector('.ns-banner2 .coupon-container');
        const couponLabelEl = document.querySelector('.ns-banner2 .coupon-label');
        const couponCodeEl = document.querySelector('.ns-banner2 .coupon-code');

        const clickAreaEl = document.querySelector('.ns-banner2 .main-click-area');
        
        function onClickDown() {
          playClickAudio();
          onMouseDownkDoll();
          addCouponCount();

          clickAreaCursorEl.children[0].classList.add('hidden');
          clickAreaCursorEl.children[1].classList.remove('hidden');
        }

        function onClickUp() {
          onMouseUpkDoll();
          clickAreaCursorEl.children[1].classList.add('hidden');
          clickAreaCursorEl.children[0].classList.remove('hidden');
        }

        clickAreaEl.addEventListener('mousedown', e => {
          if (isMobile) return;
          showPlusAni({ x: e.offsetX, y: e.offsetY });
          onClickDown();
        });

        window.addEventListener('mouseup', () => {
          if (isMobile) return;
          onClickUp();
        });

        clickAreaEl.addEventListener('touchstart', e => {
          e.preventDefault();
          if (!isMobile) return;
          const br = e.target.getBoundingClientRect();
          showPlusAni({ x: e.touches[0].clientX - br.left, y: e.touches[0].clientY - br.top });
          onClickDown(e);
        });

        window.addEventListener('touchend', () => {
          if (!isMobile) return;
          onClickUp();
        });

        clickAreaEl.addEventListener('mousemove', e => {
          mousePos.x = e.pageX;
          mousePos.y = e.pageY;
          clickAreaCursorEl.style.top = `${e.offsetY}px`;
          clickAreaCursorEl.style.left = `${e.offsetX}px`;
        });

        clickAreaEl.addEventListener('mouseover', e => {
          clickAreaCursorEl.classList.remove('hidden');
        });

        clickAreaEl.addEventListener('mouseout', e => {
          clickAreaCursorEl.classList.add('hidden');
        });

        function onMouseDownkDoll() {
          if (isExceedCouponCountThreshold) {
            mainImg3El.classList.add('hidden');
            mainImg4El.classList.remove('hidden');
          } else {
            mainImg1El.classList.add('hidden');
            mainImg2El.classList.remove('hidden');
          }
        }

        function onMouseUpkDoll() {
          if (isExceedCouponCountThreshold) {
            mainImg4El.classList.add('hidden');
            mainImg3El.classList.remove('hidden');
          } else {
            mainImg2El.classList.add('hidden');
            mainImg1El.classList.remove('hidden');
          }
        }

        function addCouponCount() {
          if (couponCount >= COUNT_LIMIT - 1) {
            counterValueEl.classList.add('hidden-o');
            countExceedLimitEl.classList.remove('hidden-o');
            return;
          }
          couponCount++;
          sessionStorage.setItem(STORE_KEY.BANNER_DOLL_COUNT, couponCount);
          counterValueEl.innerText = couponCount;
          if (couponCount % COUNT_THRESHELD === 0) {
            new Audio('images/on_coupon_shown.m4a').play();
            if (!isExceedCouponCountThreshold) {
              isExceedCouponCountThreshold = true;
              mainImg1El.classList.add('hidden');
              mainImg2El.classList.add('hidden');
              mainImg3El.classList.remove('hidden');
            }
            smokeEl.classList.remove('hidden');
            setTimeout(() => {
              smokeEl.classList.add('hidden');
            }, 300);
            chooseCoupon();
          }
        }

        function chooseCoupon() {
          couponContainerEl.classList.remove('hidden');

          const randomIndex = Math.floor(Math.random() * coupons.length);
          const coupon = coupons[randomIndex];
          couponLabelEl.innerText = coupon.label;
          couponCodeEl.innerText = coupon.code;
        }

        function showPlusAni({ x, y }) {
          const plusEl = document.createElement('div');
          const plusImgEl = document.createElement('img');
          plusImgEl.src = 'images/new_index_plus.png';
          plusEl.append(plusImgEl);
          plusEl.classList.add('ns-banner2-plus-item');
          plusEl.style.top = `${y}px`;
          plusEl.style.left = `${x}px`;
          document.querySelector('.ns-banner2 .main-click-area-container').append(plusEl);
          setTimeout(() => {
            plusEl.remove();
          }, 5000);
        }
      });
    </script>

  width: 100%;

<script>
setTimeout(() => {
  let elBacktop = document.getElementById('ns-backtop');
  let isShow = false;
  elBacktop.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: 'smooth',
    });
  });

  function debounce(fn, delay = 500) {
    let timer;
  
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        fn(...args);
      }, delay);
    };
  }

  const onScroll = debounce(() => {
    if (window.scrollY > 100) {
      if (!isShow) {
        elBacktop.classList.add('show');
        isShow = true;
      }
    } else {
	  if (isShow) {
	    elBacktop.classList.remove('show');
		isShow = false;
	  }
    }
  }, 100);

  window.addEventListener('scroll', onScroll);
});

</script>

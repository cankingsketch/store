<style>
  /* 首頁樣品：內容和版面尺寸照正式站原本的首頁，外觀套用周邊頁／貼紙頁那一套（shop-v3.css）。
     他要的：首圖大小比例維持原版、白框的大小形狀照原本的紅色圓角矩形，只是紅底改白框。
     尺寸都是在正式站 1440 寬實際量的：首圖膠囊 912×274 圓角 90；四個區塊 730 寬、圓角 130、上下內距 41。 */

  /* ---- 開場：原本 912×274 的膠囊範圍（白框拿掉了，他要的；直接放在直條紋上），插圖、標語、對話框、星星照原本位置 ---- */
  .hero-wrap { padding:96px 0 74px; }
  .hero { position:relative; width:min(912px, 100%); aspect-ratio:912 / 274; margin:0 auto; border-radius:calc(min(912px, 100vw) * 90 / 912); }
  .hero > * { position:absolute; display:block; }
  .hero img { width:100%; height:auto; display:block; }
  .hero a { transition:transform .18s; }
  .hero a:hover { transform:scale(1.07) rotate(-2deg); }
  /* 對話框是入口（他要的 F）：底下墊一層偏移的紅色實心影子，像浮起來的貼紙／按鈕；滑上去浮更高，按下去壓扁貼回去 */
  .hero a img { filter:drop-shadow(3px 5px 0 rgba(232,62,48,.55)); transition:filter .18s, translate .12s; }
  .hero a:hover img { filter:drop-shadow(5px 8px 0 rgba(232,62,48,.5)); }
  .hero a:active img { filter:drop-shadow(1px 1px 0 rgba(232,62,48,.6)); translate:2px 4px; }
  /* 進場照正式站：主圖從 0.7 倍放大、對話框從中間往外滑到定位，1 秒、同一條曲線，只跑一次 */
  .hero .main, .hero a { animation:1s cubic-bezier(.1, .24, .04, .99) both; }
  .hero .main { animation-name:hero-main; }
  .hero a { animation-name:hero-out; }
  @keyframes hero-main { from { scale:.7; } }
  @keyframes hero-out { from { translate:var(--dx) 0; } }
  @media (prefers-reduced-motion:reduce) { .hero .main, .hero a { animation:none; } }
  /* 原本是白字的標語：拿圖當遮罩塗成紅色，白框上才看得到 */
  /* 「歡迎來到空罐商店」標語拿掉了（他要的），那個位置讓給放大的「周邊」對話框 */
  .hero .title { background:var(--red2); -webkit-mask:var(--src) center / contain no-repeat; mask:var(--src) center / contain no-repeat; aspect-ratio:562 / 68; }
  .hero .tw { animation:twinkle 1.2s steps(1) infinite; }
  .hero .tw.b { animation-delay:.6s; }
  @keyframes twinkle { 0% { opacity:1; } 50% { opacity:0; } }

  /* ---- 四個區塊：730 寬、圓角 130 的白框；吉祥物動圖站在框邊（位置照原本） ---- */
  /* 高度照原本四塊（329／442／427／501），內容在框裡上下置中 */
  .sec { display:flex; flex-direction:column; justify-content:center; align-items:center; box-sizing:border-box; position:relative; width:min(730px, 100%); margin:0 auto; padding:41px 0; border-radius:min(130px, 18vw); text-align:center; }
  .sec .mascot { position:absolute; z-index:1; height:auto; pointer-events:none; }
  /* 原本是白字標題圖（EVENT 近期活動…）→ 改成粗體中文＋小英文（跟貼紙頁一樣） */
  .sec h2 { margin:0; font-size:30px; font-weight:900; letter-spacing:.06em; color:var(--ink); }
  .sec .en { margin:4px 0 0; color:var(--mute); font-size:12px; font-weight:700; letter-spacing:.18em; }
  .more { display:inline-block; margin-top:18px; color:#9a9a9a; font-size:11.5px; font-weight:700; letter-spacing:.12em; text-decoration:none; }
  .more:hover { color:#555; }

  /* 近期活動：每一場一張淡粉色的小卡並排（像月曆／票根），日期用大字當主角，框裡的空間才撐得起來 */
  .ev { list-style:none; margin:26px 0 0; padding:0 40px; display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px; }
  .ev li { display:flex; align-items:center; gap:14px; background:#fff4f2; border-radius:18px; padding:16px 18px; text-align:left; }
  .ev .d { flex:none; text-align:center; padding-right:16px; border-right:2px dashed #f1cfca; line-height:1.1; }
  .ev .d small { display:block; font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--mute); }
  .ev .d b { display:block; font-size:30px; font-weight:900; color:var(--red2); letter-spacing:.02em; margin:2px 0; }
  .ev .d span { display:block; font-size:13px; color:#666; }
  .ev .n b { display:block; white-space:nowrap; font-size:19px; font-weight:900; color:var(--ink); line-height:1.3; }
  .ev .n small { display:block; margin-top:4px; font-size:14px; color:#555; }
  /* 周邊、插畫：跟原本一樣一排滿版到框邊（被圓角裁掉），可以左右拖／滑 */
  .sec > .row, .sec > .lessons, .sec > .ev { align-self:stretch; }
  .row { display:flex; gap:10px; margin-top:24px; overflow-x:auto; scrollbar-width:none; cursor:grab; user-select:none; -webkit-user-select:none; }
  .row::-webkit-scrollbar { display:none; }
  .row.dragging { cursor:grabbing; }
  .row.dragging a { pointer-events:none; }
  .row a { flex:0 0 auto; width:180px; aspect-ratio:1 / 1; overflow:hidden; background:#f4f3f0; }
  .row img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s; }
  .row a:hover img { transform:scale(1.04); }

  /* 課程：三張 230 的圖並排（原本的位置） */
  .lessons { display:flex; justify-content:center; gap:10px; margin-top:28px; padding:0 10px; }
  .lessons a { flex:0 1 230px; display:block; transition:transform .15s; }
  .lessons a:hover { transform:translateY(-3px); }
  .lessons img { display:block; width:100%; aspect-ratio:1 / 1; object-fit:cover; }

  .band.home { padding:60px 16px; }

  /* 聯絡我們：信箱地址＋寄信／複製兩顆鈕（沒有表單） */
  .contact-band { padding:36px 16px 44px; }
  .contact { width:min(520px, 100%); margin:0 auto; padding:22px 24px 10px; border-radius:32px; text-align:center; box-sizing:border-box; }
  .contact h2 { margin:0; font-size:24px; font-weight:900; letter-spacing:.06em; color:var(--ink); }
  .contact .en { margin:2px 0 10px; color:var(--mute); font-size:11px; font-weight:700; letter-spacing:.18em; }
  .contact .addr { font:inherit; font-size:18px; font-weight:700; color:var(--ink); background:none; border:0; padding:2px 6px; cursor:pointer;
    word-break:break-all; border-radius:8px; }
  .contact .addr:hover { background:#fff1ee; }
  .contact .acts { display:flex; justify-content:center; gap:10px; margin-top:10px; }
  .contact .acts > * { font:inherit; font-size:15px; font-weight:800; min-width:110px; padding:9px 0; border-radius:999px; cursor:pointer;
    text-decoration:none; box-sizing:border-box; transition:transform .15s, box-shadow .15s; }
  .contact .go { color:#fff; background:var(--red2); border:1.5px solid var(--red2); }
  .contact .cp { color:var(--red2); background:#fff; border:1.5px solid #f1cfca; }
  .contact .acts > *:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(255,45,45,.2); }
  .contact .hint { margin:6px 0 0; min-height:16px; font-size:12px; line-height:16px; color:#3a8a55; }
  /* 沒有白框的區塊（空罐周邊）：只有標題＋吉祥物，下面接輪播 */
  .sec.plain { padding:41px 0 0; }
  .carousel-band .mq-wrap { margin-top:18px; }
  .plain-more { text-align:center; }
  @media (max-width:760px) {
    .hero-wrap { padding:40px 0 50px; }   /* 頁首下面已經有一條點點底，這裡少留一點 */
    .sec h2 { font-size:25px; }
    .sec .mascot { transform:scale(.5); transform-origin:top left; }
    .band.home { padding:34px 12px; }
    .sec { padding:30px 0; }
    .sec.plain { padding:26px 0 0; }
    .carousel-band .mq-wrap { margin-top:14px; }
    /* VIEW ALL：手機上做成置中的膠囊鈕（照ちいかわ的「もっと見る」），但維持白底灰字、不搶眼 */
    .more { margin-top:16px; padding:11px 30px; background:#fff; border:1.5px solid #ead7d3; border-radius:999px; font-size:12px; color:#777; }
    .plain-more { padding-top:2px; }
    /* 近期活動（他選的 C）：白框不設最小高度、兩場活動左右並排成兩張小卡；第三場自己佔一整排 */
    .sec.white-box { min-height:0 !important; padding:26px 14px 18px; border-radius:36px; }
    .sec h2 { font-size:22px; }
    /* 近期活動的吉祥物：放在「近期活動」標題右側（他要的），大小是上一版的 0.9 倍（寬約 94px），中線對齊標題那一行。
       用畫面中線定位（標題置中），各種寬度的手機都貼在標題右邊 */
    .sec.white-box .mascot { left:calc(50% + 52px) !important; top:0 !important; transform:scale(.585); }
    /* 插畫作品的吉祥物：放大 1.2 倍（.5→.6）、往下移，中線對齊「插畫作品」那行字（他要的） */
    .sec.plain .mascot[src*="illust_can"] { transform:translate(0, 49px) scale(.6); }
    .ev { grid-template-columns:1fr 1fr; gap:8px; padding:0; margin-top:16px; }
    .ev li { flex-direction:column; align-items:center; gap:6px; padding:12px 8px; border-radius:16px; text-align:center; }
    .ev li:last-child:nth-child(odd) { grid-column:1 / -1; }
    .ev .d { padding-right:0; border-right:0; }
    .ev .d small { font-size:10.5px; }
    .ev .d b { font-size:22px; margin:1px 0; }
    .ev .d span { font-size:11px; }
    .ev .n b { font-size:14px; white-space:normal; }
    .ev .n small { margin-top:2px; font-size:11.5px; }
    .row a { width:130px; }
    .ev { padding:0 18px; }
    .lessons { flex-direction:column; align-items:center; }
    .lessons a { flex-basis:auto; width:min(230px, 80%); }
  }
</style>

<body>

<script>
(function () {
  var IMG = 'images/';
  var LINKS = CK_SHOP.LINKS;   // 選單全部連到 v3 樣品（shop-v3.js）
  var W = 912, H = 274;                    // 開場膠囊的原尺寸（px）

  // 開場的每一個零件：[圖, 連結, 左, 上, 寬]，單位 px，相對白色膠囊左上角（正式站 1440 寬量的）
  var HERO = [
    ['new_index_main_1.png', '', 164, -76, 511, 'main'],
    ['new_index_twinkle_a.png', '', 274, -83, 292, 'tw a'],
    ['new_index_twinkle_b.png', '', 292, -83, 292, 'tw b'],
    ['new_index_rank.png', '', 684, 294, 146],
    // 周邊是最重要的一頁（他要的）：往上移到原本標語的位置、放大（原本 96,52 寬 141），疊在其他對話框上面
    ['new_index_dialog_1.png?26010201', 'goods.html', 62, -8, 192, 'big', 5],                            // 周邊
    ['new_index_dialog_2.png', 'lessons.html', 23, 123, 201, '', 9.5],                // 課程
    ['new_index_dialog_3.png', '3005920874.html', 119, 202, 137, '', 8],              // 畫冊
    ['new_index_dialog_4.png', 'events.html', 667, 25, 136, '', -4],                  // 活動
    ['new_index_dialog_5.png', 'stickers.html', 717, 90, 163, '', -10],                                 // 貼圖
    ['new_index_dialog_6.png?26010201', '2345835069212702183021697.html', 689, 176, 140, '', -7]  // 客製
  ];
  // 近期活動：跟活動頁同一份（指揮部推送的 events-live.js＋手動的 events-data.js），最近的三場
  var EVENTS = CK_SHOP.events().up.slice(0, 3);
  // 周邊：正式站首頁那條跑馬燈的圖
  var GOODS = ['cartoong02_orig.jpg', 'catoong01_orig.jpg', 'cartoon04s_orig.jpg', 'cartoon03_orig.jpg', '1240798645_orig.png', '2_orig.jpeg',
    '674462185_orig.jpg', 'img-9472_orig.jpeg', '1808148779_orig.jpg', 'dsc01192_orig.jpg', '71221571_orig.jpg', '900918169_orig.jpeg',
    '1068899994_orig.jpg', '148499953_orig.jpg', '937539326.jpg', '2138515468_orig.png', '1416710783_orig.png', '630936751_orig.png'];
  // 插畫作品（Gumroad）：[商品頁, 封面, 商品名]（商品名給流量統計用，跟數位賣場記的一樣）
  var ARTS = [
    ['msivsi', 'k92jvyook3sigzm00km03t1za70q', '2026年9月份會員獎勵-1 雞腿筆刷畫雞腿'],
    ['sqjzcu', 'tgmwtpfsnv9utlmkbfmusa3b00uh', '2026年8月份會員獎勵-1 盥洗包明信片'],
    ['gczft', 'roye61wd3wz7azi5c6ccb4xjcprl', '2026年7月份會員獎勵-1 終末地'],
    ['lgprgb', 'n94b2vq43iv8rhusjc7qqd1ku6vl', '2026年6月份會員獎勵-1 蘋果海灘'],
    ['tzgkym', 'ect7d34yinf6l7philvysc7przi5', '2026年5月份會員獎勵-1 撐傘罐罐'],
    ['gtwdb', 'fxuxgkzoake417srzsk7h3pv6jjw', '2026年4月份會員獎勵-1 女僕烤麵包'],
    ['cjeukp', 'qisihj2ia82f2g3ahd4bjj1txoij', '2026年3月份會員獎勵-1 果醬罐頭'],
    ['oyzny', 'chtmvbwn0ltoo21a8lde4xsc0647', '2026年2月份會員獎勵-1 草莓吐司'],
    ['rpvxx', 'pztfs3cc24dxq5435lvxe8gaph4h', '2026年1月份會員獎勵-1 蛇年賀圖'],
    ['goniog', '34zo5rokuzewor7xspeasnfts8uj', '2025年12月份會員獎勵-1 拉麵破防宣傳圖']
  ];
  // 繪畫課程（hahow）
  var LESSONS = [['速寫課 1', 'sketchlesson01new_orig.jpg', 'https://hahow.in/cr/comicsketch'],
    ['速寫課 2', 'sketchlesson02new_orig.jpg', 'https://hahow.in/cr/comicsketch2'],
    ['色彩課', 'colorlessonnew_orig.jpg', 'https://hahow.in/cr/cankingcolor1']];

  var pct = function (v, of) { return (v / of * 100).toFixed(3) + '%'; };
  var hero = '<div class="hero">' +
    HERO.map(function (h) {
      var pos = 'left:' + pct(h[2], W) + ';top:' + pct(h[3], H) + ';width:' + pct(h[4], W);
      var img = '<img src="' + IMG + h[0] + '" alt="">';
      if (!h[1]) return '<span class="' + (h[5] || '') + '" style="' + pos + '">' + img + '</span>';
      if (h[5]) pos += ';z-index:2';
      pos += ';--dx:' + (h[6] * W / 100 / h[4] * 100).toFixed(1) + '%';   // 首圖寬的 % 換成自己寬的 %（translate 的 % 是算自己）
      var ext = /^https?:/.test(h[1]);
      return '<a href="' + h[1] + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + ' style="' + pos + '">' + img + '</a>';
    }).join('') + '</div>';

  // 一個區塊：白框＋吉祥物（[檔名, 左, 上, 寬] 照原本）＋標題＋內容＋VIEW ALL
  function sec(band, zh, en, m, body, href, ext, minH) {
    return '<section class="band home ' + band + '"><div class="sec white-box" style="min-height:' + minH + 'px">' +
      '<img class="mascot" src="' + CK_SHOP.opt(m[0]) + '" loading="lazy" alt="" style="left:' + m[1] + 'px;top:' + m[2] + 'px;width:' + m[3] + 'px">' +
      '<h2>' + zh + '</h2><p class="en">' + en + '</p>' + body +
      '<a class="more" href="' + href + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>VIEW ALL →</a></div></section>';
  }

  // 沒有白框的區塊：標題＋吉祥物（位置照原本），下面一條輪播、VIEW ALL。
  // fit＝跟周邊頁頂端一樣：高度統一、寬度照圖的比例，整張不裁（他要周邊這條這樣，2026-10-03）
  function carouselSec(band, zh, en, m, cards, href, ext, fit) {
    return '<section class="band home ' + band + ' carousel-band"><div class="sec plain">' +
      '<img class="mascot" src="' + CK_SHOP.opt(m[0]) + '" loading="lazy" alt="" style="left:' + m[1] + 'px;top:' + m[2] + 'px;width:' + m[3] + 'px">' +
      '<h2>' + zh + '</h2><p class="en">' + en + '</p></div>' +
      '<div class="mq-wrap"><button class="mq-arrow prev" aria-label="上一張">‹</button><div class="mq' + (fit ? ' fit' : '') + '"><div class="mq-track">' + cards.join('') +
      '</div></div><button class="mq-arrow next" aria-label="下一張">›</button></div>' +
      '<div class="plain-more"><a class="more" href="' + href + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>VIEW ALL →</a></div></section>';
  }

  document.getElementById('app').innerHTML = CK.header('首頁', ['貼紙'], LINKS) + '<main class="page bands">' +
    '<section class="band b-stripe hero-wrap"><div class="wrap">' + hero + '</div></section>' +
    sec('b-dots', '近期活動', 'EVENTS', ['event_can.gif', 29, -46, 161],
      (EVENTS.length ? '<ul class="ev">' + EVENTS.map(function (e) {
        return '<li><div class="d"><small>' + e.p[0] + '</small><b>' + e.p[1] + '</b>' + (e.p[2] ? '<span>～ ' + e.p[2] + '</span>' : '') + '</div>' +
          '<div class="n"><b>' + CK.esc(e.name) + '</b>' + (e.booth ? '<small>攤位 ' + CK.esc(e.booth) + '</small>' : '') + '</div></li>';
      }).join('') + '</ul>' : '<p class="empty">敬請期待</p>'), 'events.html', 0, 329) +
    // 周邊、插畫作品、繪畫課程：都不要白框，改成跟周邊頁最上面一樣的輪播（他要的；CK_SHOP.carousel：停一下跳一格、可拖可滑）
    carouselSec('b-stripe', '空罐周邊', 'GOODS', ['goods_can.gif', 474, -53, 233], GOODS.map(function (g) {
      return '<a class="mq-card" href="goods.html"><img src="' + CK_SHOP.opt(g) + '"' + CK_SHOP.fallback(IMG + g) + ' alt="" draggable="false"></a>';
    }), 'goods.html', 0, 1) +
    carouselSec('b-dots', '插畫作品', 'ARTWORK', ['illust_can.gif', 29, -47, 161], ARTS.map(function (a) {
      return '<a class="mq-card" data-track-label="' + a[2] + '" href="https://cankingsketch.gumroad.com/l/' + a[0] + '" target="_blank" rel="noopener"><img src="' + CK_SHOP.opt('https://public-files.gumroad.com/' + a[1]) + '"' + CK_SHOP.fallback('https://public-files.gumroad.com/' + a[1]) + ' alt="" loading="lazy" draggable="false"></a>';
    }), 'illusts.html') +
    carouselSec('b-stripe', '繪畫課程', 'LESSONS', ['lesson_can.gif', 525, -45, 175], LESSONS.map(function (l) {
      return '<a class="mq-card" href="' + l[2] + '" target="_blank" rel="noopener"><img src="' + CK_SHOP.opt(l[1]) + '"' + CK_SHOP.fallback(IMG + l[1]) + ' alt="' + l[0] + '" loading="lazy" draggable="false"></a>';
    }), 'lessons.html') +
    // 聯絡我們（他要的）：不用表單——直接顯示信箱，「寄信」打開手機／電腦的寄信 App，「複製」拿走地址。
    // 電腦常常沒設寄信程式，所以按「寄信」也會順便複製，沒跳出來的話直接貼上就好
    '<section class="band b-dots contact-band"><div class="contact white-box">' +
      '<h2>聯絡我們</h2><p class="en">CONTACT</p>' +
      '<button type="button" class="addr" id="mail-addr" aria-label="複製信箱"></button>' +
      '<div class="acts"><a class="go" id="mail-go">寄信</a><button type="button" class="cp" id="mail-cp">複製</button></div>' +
      '<p class="hint" id="contact-hint"></p>' +
    '</div></section>' +
    '</main>' + CK.footer();
  CK_SHOP.chars();
  Array.prototype.forEach.call(document.querySelectorAll('.carousel-band .mq-wrap'), CK_SHOP.carousel);
  // 頁尾的信箱鈕拿掉（他要的，改用上面的聯絡表單）；最後一區是點點，頁尾半圓用預設的點點底色
  var mailBtn = document.querySelector('.site-foot a[aria-label="Email"]'); if (mailBtn) mailBtn.remove();

  // 聯絡我們：信箱拆開寫、在這裡才組起來，原始碼裡不會出現完整地址（擋一點爬蟲）
  var MAIL = ['a12710xxx', 'gmail.com'].join('@'), hint = document.getElementById('contact-hint'), hintT;
  document.getElementById('mail-addr').textContent = MAIL;
  document.getElementById('mail-go').href = 'mailto:' + MAIL;
  function copyMail(msg) {
    function done() { hint.textContent = msg; clearTimeout(hintT); hintT = setTimeout(function () { hint.textContent = ''; }, 3000); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(MAIL).then(done, fallback); else fallback();
    function fallback() {   // 舊瀏覽器：用隱藏文字框複製
      var t = document.createElement('textarea'); t.value = MAIL; t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) {} t.remove();
    }
  }
  document.getElementById('mail-addr').addEventListener('click', function () { copyMail('已複製信箱'); });
  document.getElementById('mail-cp').addEventListener('click', function () { copyMail('已複製信箱'); });
  document.getElementById('mail-go').addEventListener('click', function () { copyMail('信箱也已複製，沒跳出寄信程式的話直接貼上'); });

  // 左右滑的一排：電腦按住拖（拖過不算點擊）、手機用原生滑動
  Array.prototype.forEach.call(document.querySelectorAll('.row'), function (row) {
    var down = null, moved = false;
    row.addEventListener('pointerdown', function (e) {
      moved = false;
      if (e.pointerType !== 'mouse') return;
      down = { x: e.clientX, left: row.scrollLeft, id: e.pointerId };
    });
    window.addEventListener('pointermove', function (e) {
      if (!down || e.pointerId !== down.id) return;
      var dx = e.clientX - down.x;
      if (Math.abs(dx) > 5) { moved = true; row.classList.add('dragging'); }
      if (moved) row.scrollLeft = down.left - dx;
    });
    window.addEventListener('pointerup', function () { down = null; row.classList.remove('dragging'); });
    row.addEventListener('click', function (e) { if (moved) { moved = false; e.preventDefault(); e.stopPropagation(); } }, true);
  });
})();
</script>
<script defer src="/track.js"></script>
</body>
